  { year:1943, type:'supply',      label:'US sliced bread ban (WW2)',        desc:'The US briefly banned the sale of sliced bread in January as a wartime conservation measure. Public outcry forced rescission within ~2 months. Early example of wartime rationing constraining food service. Origin of the phrase "the greatest thing since sliced bread."' },
  { year:1948, type:'industry',    label:'Speedee Service System',           desc:'McDonald brothers launch the Speedee Service System in San Bernardino CA. Strips the menu and applies assembly-line principles. Foundation that every later efficiency and labor debate builds upon.' },
  { year:1954, type:'industry',    label:'Kroc joins, franchising begins',   desc:'Ray Kroc joins McDonald\'s and begins franchising. Franchising becomes the dominant ownership structure of the industry and later shapes every labor and wage fight, since franchisees and corporate parents face different cost pressures.' },
  { year:1965, type:'industry',    label:"McDonald's goes public",           desc:'McDonald\'s IPO. Fast food becomes a serious capital-market enterprise. Public ownership ties the industry to shareholder growth expectations -- pressure that drives much of the expansion and cost cutting seen in later decades.' },
  { year:1968, type:'industry',    label:'Big Mac introduced',               desc:'National launch of the Big Mac. Establishes the signature-product strategy where a single iconic item anchors brand identity. The model competitors chase for the next 50 years.' },
  { year:1971, type:'economic',    label:'Nixon ends gold standard',         desc:'Nixon ends the gold standard and imposes wage and price controls amid rising inflation. Food input costs become harder to predict, pushing the industry toward supply contracts and vertical integration.' },
  { year:1973, type:'supply',      label:'OPEC oil embargo',                 desc:'Fuel shortages, gas rationing, 55 mph speed limit, stagflation. Strikes directly at the carhop drive-in model (customers parked and ate in idling cars). Crisis accelerates the shift from park-and-serve to drive-thru. Same year: Egg McMuffin opens the breakfast daypart.' },
  { year:1975, type:'industry',    label:'First modern drive-thru',          desc:'McDonald\'s opens its first modern drive-thru in Sierra Vista AZ, reportedly to serve soldiers who couldn\'t leave their vehicles in uniform. Arriving in the fuel-crisis era, it proves the efficient, low-idle format the moment demanded. The single most important physical innovation in the industry -- the same feature that would save it during COVID.' },
  { year:1979, type:'supply',      label:'Iranian Revolution / 2nd oil shock', desc:'Iranian Revolution triggers a second oil shock. Compounds pressures of 1973. For remaining classic drive-ins, often the final blow -- through the late 70s and early 80s many carhop establishments close or convert to drive-thru. Chains built around fuel-efficient throughput gain a durable advantage.' },
  { year:1986, type:'social',      label:'Slow Food / "McJob" coined',       desc:'Slow Food movement founded in Italy in direct reaction to fast food culture. Term "McJob" enters public discourse. First sustained cultural and intellectual backlash against the industry -- seeds for the health and labor criticisms that would intensify for decades.' },
  { year:1990, type:'social',      label:'Moscow McDonald\'s / oil switch',  desc:'McDonald\'s opens in Moscow as the USSR collapses -- fast food becomes a global symbol of Western consumer capitalism. Same year: under pressure from Phil Sokolof\'s anti-cholesterol campaign, McDonald\'s switches from beef tallow to vegetable oil for fries. First major nutrition-driven reformulation forced by public pressure.' },
  { year:1992, type:'social',      label:'McLibel case begins',              desc:'McDonald\'s sues UK activists in a libel battle that drags on for years and generates enormous negative publicity. Demonstrates that the industry\'s scale makes it a permanent target for activism around health, labor, and environment.' },
  { year:1993, type:'outbreak',    label:'Jack in the Box E. coli',          desc:'E. coli O157:H7 outbreak kills 4 children, sickens 700+. The most consequential food-safety event in industry history. Directly accelerates HACCP adoption and rewrites cooking temperature and supply chain standards across the entire sector.' },
  { year:1994, type:'regulation',  label:'NAFTA takes effect',               desc:'Reshapes supply chains for beef, produce, and other inputs across the US, Mexico, and Canada. Cheaper and more integrated cross-border sourcing lowers input costs but exposes the industry to trade policy as a permanent variable.' },
  { year:1996, type:'regulation',  label:'USDA HACCP rule finalized',        desc:'USDA issues the Pathogen Reduction and HACCP rule for meat and poultry, codifying into federal regulation the food-safety logic that the Jack in the Box disaster exposed. A clear case of an outbreak event producing durable legislation.' },
  { year:1996, type:'outbreak',    label:'UK BSE / Mad Cow crisis',          desc:'UK BSE crisis reaches full public panic. Mass cattle culls. International bans on British beef. Establishes disease-driven trade bans as a recurring threat to beef-centric menus, pushing long-term diversification toward chicken.' },
  { year:2000, type:'social',      label:'Fast Food Nation published',       desc:'Eric Schlosser\'s bestselling investigation into the industry\'s labor, health, and supply practices. Crystallizes public skepticism and sets the cultural stage for the obesity and transparency battles of the following decade.' },
  { year:2001, type:'geopolitical',label:'September 11 attacks',             desc:'Sharp shock to consumer spending and travel. Hits restaurants tied to airports, highways, tourism. Lasting effect: acceleration toward convenience and drive-thru formats as Americans favored familiar, low-cost, low-risk options during deep uncertainty.' },
  { year:2001, type:'outbreak',    label:'UK foot-and-mouth outbreak',       desc:'Massive livestock culls disrupt meat supply across Europe. Reinforces for global operators that animal disease is a permanent supply chain risk requiring sourcing flexibility.' },
  { year:2002, type:'regulation',  label:"Pelman v. McDonald's filed",       desc:'Lawsuit blaming McDonald\'s for childhood obesity filed in New York. Ultimately unsuccessful, but triggers a wave of legislative and public debate about industry responsibility for diet-related disease.' },
  { year:2003, type:'outbreak',    label:'First US domestic BSE case',       desc:'US confirms first domestic case of BSE in December. Dozens of countries ban American beef imports almost overnight. Disrupts export markets, hits beef-supply economics, validates the strategic shift toward chicken.' },
  { year:2004, type:'social',      label:'Super Size Me released',           desc:'Morgan Spurlock\'s documentary. Within months, McDonald\'s discontinues its Super Size option. Accelerates menu reformulation, addition of salads and fruit, broad industry pivot toward health-halo marketing.' },
  { year:2004, type:'regulation',  label:'Cheeseburger Bill (House)',        desc:'Personal Responsibility in Food Consumption Act passes the US House -- an attempt to shield the industry from obesity lawsuits. Shows how directly the obesity backlash had moved from culture into legislative chambers.' },
  { year:2006, type:'regulation',  label:'NYC bans trans fats',              desc:'New York City enacts the first major municipal ban on artificial trans fats in restaurants. Forces widespread reformulation of frying oils and processed ingredients. Local law ripples outward and previews the menu transparency mandates that would follow.' },
  { year:2008, type:'economic',    label:'Global financial crisis',          desc:'GFC devastates the broader economy, yet QSR proves counter-cyclical as consumers trade down from casual dining. Ignites the value-menu wars -- dollar menus become the central competitive battleground for years.' },
  { year:2008, type:'regulation',  label:'NYC mandates calorie counts',      desc:'New York City becomes the first jurisdiction in the nation to mandate calorie counts on chain restaurant menus. Direct template for the federal labeling law that would arrive two years later.' },
  { year:2009, type:'outbreak',    label:'H1N1 swine flu pandemic',          desc:'Global spread of H1N1. Though it didn\'t transmit through pork, the name itself damaged pork demand. Another disease-driven supply and perception shock to the industry\'s risk landscape.' },
  { year:2010, type:'regulation',  label:'ACA / calorie labeling mandate',   desc:'Affordable Care Act signed. Section 4205 mandates calorie labeling on the menus of chains with 20+ locations. Employer health coverage obligations significantly affect large QSR employers. One of the most consequential pieces of legislation ever to hit the industry.' },
  { year:2010, type:'technology',  label:'Self-service kiosks begin',        desc:'Self-service ordering kiosks begin appearing in QSR. Adoption accelerates sharply later (McDonald\'s Experience of the Future from 2017 onward), but this period marks the start of the kiosk era as a deliberate response to rising labor costs and a desire for order accuracy and consistent upselling.' },
  { year:2011, type:'supply',      label:'Arab Spring / wheat spike',        desc:'Arab Spring unfolds against spiking global wheat and food commodity prices. Reminds operators that geopolitical instability translates almost immediately into input cost volatility for grain-heavy menus.' },
  { year:2012, type:'labor',       label:'Fight for $15 launches',           desc:'NYC fast-food worker strikes in November demand a $15 minimum wage. The single longest-running labor arc in modern QSR history -- one that would accelerate automation and culminate in landmark state legislation a decade later.' },
  { year:2013, type:'outbreak',    label:'European horsemeat scandal',       desc:'Products labeled as beef found to contain undisclosed horsemeat. Exposes deep vulnerabilities in the global meat supply chain. Intensifies demands for supply chain traceability and ingredient transparency.' },
  { year:2014, type:'supply',      label:'CA drought / fast casual peaks',   desc:'Severe drought in California raises produce and cattle-feed costs. Fast-casual segment led by Chipotle reaches a competitive peak. Period pressures traditional QSR to improve perceived food quality to defend market share.' },
  { year:2015, type:'outbreak',    label:'Chipotle E. coli outbreaks',       desc:'Series of E. coli and norovirus outbreaks devastate Chipotle\'s brand and sales for years. Modern reminder that food safety failures remain existential, even for brands built on a quality reputation.' },
  { year:2015, type:'outbreak',    label:'US H5N1 / egg shortage',           desc:'Major HPAI outbreak in the US kills tens of millions of birds. Egg shortages and price spikes hit breakfast menus and egg-dependent products. Early instance of the bird-flu pattern that would return with greater force a decade later.' },
  { year:2015, type:'technology',  label:'Third-party delivery scales',      desc:'DoorDash, Uber Eats, Grubhub scale rapidly. Fundamental change to QSR unit economics begins. Commission fees, delivery-only virtual brands, and the contest over who owns customer data all trace to this period.' },
  { year:2016, type:'regulation',  label:'FDA finalizes menu labeling',      desc:'FDA finalizes the federal menu labeling rule that implements the ACA calorie disclosure requirement nationwide. Regulation that began as a NYC experiment in 2008 becomes binding national law.' },
  { year:2018, type:'regulation',  label:'Federal calorie labeling begins',  desc:'Federal enforcement of menu calorie labeling formally begins. Nutritional transparency becomes a permanent operational requirement for chains across the country. The long arc from cultural backlash to federal mandate is complete.' },
  { year:2018, type:'regulation',  label:'CA plastic straw law',             desc:'California enacts AB 1884, becoming the first state to bar full-service restaurants from automatically handing out plastic straws. Opens environmental and packaging policy as a distinct regulatory front, separate from food safety or nutrition. Paper-straw rule later politically contested -- federal pushback by 2025.' },
  { year:2019, type:'industry',    label:'Chicken sandwich wars',            desc:'Popeyes launches a sandwich in August that directly challenges Chick-fil-A. Viral demand and supply shortages. Confirms chicken\'s ascendance over beef as the industry\'s strategic center of gravity. Showcases the power of social-media-driven demand.' },
  { year:2020, type:'outbreak',    label:'COVID-19 pandemic',                desc:'The single most transformative event in industry history. Dining rooms close. Overnight pivot to drive-thru, delivery, mobile ordering, ghost kitchens. Brands without strong drive-thru infrastructure are severely damaged. Crisis triggers the labor shortage that feeds into the wage battles. PPP loans reshape operator finances.' },
  { year:2020, type:'industry',    label:'Plant-based protein boom',         desc:'Beyond Meat and Impossible Foods partnerships expand across major chains. Momentum later cools, but plant-based options become a permanent part of the industry\'s menu strategy.' },
  { year:2021, type:'labor',       label:'Great Resignation / wage hikes',   desc:'Severe labor shortage forces widespread wage increases and signing bonuses. Accelerates investment in kiosks and automation as operators seek to reduce dependence on scarce labor.' },
  { year:2022, type:'economic',    label:'Inflation / supply disruptions',   desc:'Surge of inflation and persistent supply chain disruptions drive years of menu price increases. Fundamentally alters the value proposition that had long defined QSR. Rising costs strain the affordability that is central to the industry\'s identity.' },
  { year:2022, type:'geopolitical',label:'McDonald\'s exits Russia',         desc:'Russia\'s invasion of Ukraine prompts McDonald\'s to exit after 30+ years. Symbolic and financial milestone. War spikes global wheat and cooking-oil prices. A single geopolitical event delivers both a brand-defining decision and a direct commodity cost shock.' },
  { year:2023, type:'outbreak',    label:'H5N1 intensifies / egg crisis',    desc:'Highly pathogenic H5N1 avian influenza outbreak intensifies. Enormous bird losses send egg prices to record highs. Squeezes breakfast economics and egg-dependent products precisely as inflation strains margins.' },
  { year:2023, type:'labor',       label:'CA AB1228 / FAST Recovery Act',    desc:'California passes AB 1228, the FAST Recovery Act -- $20/hour minimum wage for fast food workers at large chains, effective April 2024. Legislative culmination of the Fight for 15 arc that began in 2012.' },
  { year:2024, type:'labor',       label:'CA $20 wage takes effect',         desc:'California $20 minimum wage takes effect in April. Sharply raises labor costs for QSR operators in the nation\'s largest state. Accelerates kiosk adoption, menu price increases, automation investment. National bellwether for fast food labor policy.' },
  { year:2024, type:'outbreak',    label:"McDonald's E. coli (onions)",      desc:'McDonald\'s E. coli outbreak linked to slivered onions on Quarter Pounders. Sickens dozens across multiple states in October. Rapid supply changes follow. Demonstrates that even after three decades of food safety regulation, supply chain contamination remains a live and brand-threatening risk.' },
  { year:2024, type:'economic',    label:'$5 value meal wars return',        desc:'Consumers push back against years of price increases. Value-meal wars return. McDonald\'s launches a $5 meal, competitors follow. Industry forced to rediscover affordability -- closes a loop that the 2008 trade-down era first opened.' },
  { year:2025, type:'economic',    label:'Compounded margin pressure',       desc:'Combined pressure of persistent avian influenza, elevated input costs, and high interest rates keeps margins under strain. Automation and digital ordering continue their advance. Reinforces the central lesson: the industry absorbs shocks by permanently restructuring rather than returning to a prior normal.' },

  // ===== INFRASTRUCTURE / SUPPLY CHAIN ENABLERS =====
  { year:1880, type:'industry',    label:'Harvey House chain expansion',     desc:'Fred Harvey\'s Harvey House restaurants (first opened 1876 in Topeka KS) reach major scale alongside the Santa Fe railway. The first true American restaurant chain -- standardized menus, uniformed staff (the famous "Harvey Girls"), centralized supply contracts, rail-timed service. Prototype for chain dining 40 years before White Castle. By 1900s Harvey Houses run from Chicago to LA.' },
  { year:1924, type:'infrastructure',label:'US Numbered Highway System',     desc:'Federal Aid Highway Act of 1921 + 1926 numbering scheme create US Routes 1, 66, 40, etc. Auto-tourism explodes. Roadside dining culture is born: diners, drive-ins, motor courts, Stuckey\'s, Howard Johnson\'s, Big Boys. The format that the Interstate System would later kill.' },
  { year:1925, type:'industry',    label:'Howard Johnson franchising',       desc:'Howard Johnson begins franchising in Quincy MA, the first major restaurant franchise model. Standardized 28 ice cream flavors, orange roofs, supply chain centralization -- decades before Kroc. Peaks at ~1,000 locations on US Routes before the Interstate kills the format.' },
  { year:1926, type:'industry',    label:'Taylor soft-serve freezer',        desc:'Taylor Company invents the continuous-batch soft-serve freezer in Rockton IL. Dairy Queen (1940), Mr. Softee, and the entire soft-serve category exist because of this machine. McDonald\'s milkshake machine -- the one Kroc was selling when he met the McDonald brothers -- was a Taylor descendant.' },
  { year:1930, type:'infrastructure',label:'Birds Eye frozen retail',        desc:'Clarence Birdseye launches flash-frozen retail food. Combined with refrigerated rail (1920s) and trucks (1940s post-Frederick McKinley Jones), this creates the cold chain. Without it, no McDonald\'s frozen patty, no national QSR supply.' },
  { year:1956, type:'infrastructure',label:'Interstate Highway Act',         desc:'Eisenhower signs the Federal-Aid Highway Act of 1956 -- 41,000 miles of interstates. SIMULTANEOUSLY: kills the US-route diner/motor-court economy (Howard Johnson\'s, Stuckey\'s, small-town drive-ins lose traffic) AND enables exit-ramp QSR (McDonald\'s, KFC, Burger King build at interchanges). Same year, Sanders franchises KFC because I-75 kills his Corbin gas-station traffic. The single biggest infrastructure cause of the 1956-1975 chain explosion.' },
  { year:1956, type:'industry',    label:'Sonneborn real estate model',      desc:'McDonald\'s CFO Harry Sonneborn invents Franchise Realty Corp: McDonald\'s buys the land, leases it to the franchisee, collects rent + royalty + supply margin. *"We are not in the food business. We are in the real estate business."* The single most important business-model innovation in QSR history. By 2026, McDonald\'s real estate book value ~$42B, market value ~$120B -- ~35% of revenue is rent.' },
  { year:1969, type:'infrastructure',label:'Sysco founded / broadline era', desc:'Sysco forms by merging nine regional foodservice distributors. Creates the modern broadline distribution model that lets a chain operate the same menu in 50 states without each store sourcing locally. National QSR scale becomes a logistics problem solved by Sysco, US Foods, McLane, PFG -- not by the restaurants themselves.' },
  { year:1973, type:'technology',  label:'Lincoln impinger pizza oven',      desc:'Lincoln Foodservice invents the conveyor impinger oven. A trained-monkey-can-make-pizza machine: dough goes in one end, finished pie comes out the other in ~6 minutes, no chef skill required. Domino\'s 30-minute promise (1979) is only possible because of this oven. The entire delivery-pizza category depends on it.' },

  // ===== BEVERAGE / COLA WARS =====
  { year:1955, type:'industry',    label:"Coca-Cola signs McDonald's",       desc:'Coca-Cola signs an exclusive pouring rights deal with McDonald\'s. Longest single supplier relationship in QSR history -- still in force in 2026. McDonald\'s Coke famously tastes different because Coke ships pre-chilled syrup in stainless steel (not plastic) and uses extra-cold filtered water. This deal is the template for every captive-pouring-rights contract since.' },
  { year:1977, type:'industry',    label:'PepsiCo buys Pizza Hut',           desc:'PepsiCo acquires Pizza Hut, then Taco Bell (1978), then KFC (1986). The strategy: own the restaurant = own a captive Pepsi-pouring market. This is why even today Pizza Hut, Taco Bell, and KFC pour Pepsi while McDonald\'s, BK, and Wendy\'s pour Coke. Chick-fil-A=Coke, Subway=Coke, Domino\'s=Coke. The Cola Wars defined QSR beverage menus for 50 years.' },
  { year:1997, type:'industry',    label:'PepsiCo spins off Tricon',         desc:'PepsiCo spins off Pizza Hut + Taco Bell + KFC into Tricon Global (renamed Yum! Brands in 2002). The captive-market thesis quietly dies: Pepsi keeps the pouring contract through the spinoff, but the integration is gone. Tricon/Yum becomes the world\'s largest restaurant company by units.' },

  // ===== CIVIL RIGHTS / DESEGREGATION =====
  { year:1960, type:'civilrights', label:'Greensboro lunch counter sit-ins', desc:'Feb 1, 1960: four Black college students sit at the segregated Woolworth lunch counter in Greensboro NC and refuse to leave. Sparks the sit-in movement across 55+ cities. QSR-relevant because the LUNCH COUNTER was the QSR of its era. Public-accommodation segregation in food service becomes the central civil rights battlefield of 1960-64.' },
  { year:1964, type:'civilrights', label:'Civil Rights Act / Title II',      desc:'Title II of the Civil Rights Act of 1964 bans discrimination in public accommodations including restaurants. QSR chains that had operated separate counters, separate entrances, or refused service must integrate. Heart of Atlanta Motel v. US (SCOTUS, Dec 1964) upholds the law. Effectively ends *de jure* segregation in restaurants.' },
  { year:1968, type:'civilrights', label:'Newman v. Piggie Park (SCOTUS)',   desc:'Maurice\'s Piggie Park BBQ (SC) refused to serve Black customers; owner Maurice Bessinger argued religious freedom. SCOTUS rules unanimously against him and establishes that civil-rights plaintiffs automatically get attorney\'s fees. Forces holdout QSRs to integrate or be sued out of business. The decision that put teeth in Title II.' },
  { year:1969, type:'civilrights', label:'McDonald\'s first Black franchisee',desc:'Herman Petty opens the first Black-owned McDonald\'s franchise in Chicago. Followed by the formation of the National Black McDonald\'s Operators Association (NBMOA) in 1972. By the 1980s, McDonald\'s franchising is a major Black wealth-building pathway -- and a source of ongoing tension when Black operators receive worse store assignments (a 2020 class-action lawsuit followed).' },
  { year:1982, type:'civilrights', label:'V&J Holdings / La-Van Hawkins',    desc:'V&J Holdings, founded by Valerie Daniels-Carter in Milwaukee, grows into the largest Black-owned QSR franchisee in US history (Burger King, Pizza Hut, Auntie Anne\'s, Coffee Bean). La-Van Hawkins\' UrbanCityFoods runs hundreds of inner-city BK locations in the 1990s. Demonstrates franchising as Black-capital formation -- and as an exit ramp from corporate QSR ceiling.' },

  // ===== ADVERTISING / TELEVISION / CHILDREN =====
  { year:1963, type:'social',      label:'Ronald McDonald debuts',           desc:'Ronald McDonald (played by Willard Scott) debuts on Washington DC TV. Saturday-morning kids advertising slots had just opened up. Within a decade, Ronald is one of the most recognized characters on Earth -- second only to Santa per a 1996 survey. Begins the kids-marketing arc that lasts until McDonald\'s scales him back ~2016.' },
  { year:1990, type:'regulation',  label:'Children\'s Television Act',       desc:'US Children\'s Television Act limits commercial time on kids programming and requires educational content. First federal regulation specifically targeting kids advertising. Creates pressure for QSR self-regulation; sets up the 2006 Better Business Bureau Children\'s Food and Beverage Advertising Initiative (CFBAI).' },
  { year:2006, type:'regulation',  label:'CFBAI self-regulation',            desc:'Better Business Bureau forms the Children\'s Food and Beverage Advertising Initiative. McDonald\'s, BK, KFC, Wendy\'s pledge to only advertise "healthier" items to kids under 12. Self-regulation chosen specifically to head off federal mandate. Mixed results: ad spend continues, just shifts framing.' },
  { year:2022, type:'regulation',  label:'CA junk-food kids ad limits',      desc:'California enacts SB 1383 restrictions on junk food advertising in schools. Multiple states follow. The kids-advertising regulatory thread (1990 CTA -> 2006 CFBAI -> 2022 SB 1383) compounds with calorie labeling and AB1228 to make California the test bed for QSR regulation nationally.' },

  // ===== INTERNATIONAL =====
  { year:1971, type:'geopolitical',label:"McDonald's Tokyo (first int'l)",   desc:'McDonald\'s opens in Ginza, Tokyo -- the first major McDonald\'s outside North America. Den Fujita\'s Japan operation becomes the template for international franchising. By 1990, McDonald\'s Japan is the second-largest McDonald\'s market in the world.' },
  { year:1990, type:'geopolitical',label:"KFC opens in Shenzhen, China",     desc:'KFC opens its first mainland-China store in Shenzhen. Yum China would eventually surpass KFC US in store count and revenue. By 2024, Yum China runs ~13,000 KFC and Pizza Hut stores. China rewrites who actually "owns" American QSR culturally and financially.' },
  { year:1996, type:'geopolitical',label:"Jollibee enters the US",           desc:'Filipino-founded Jollibee opens its first US store in Daly City CA. Begins the reverse flow -- non-Western QSR brands establishing US footprints. Today Jollibee Foods Corp owns Smashburger, Coffee Bean & Tea Leaf, and operates ~100+ Jollibee US stores. International QSR is no longer a one-way US export.' },
  { year:2014, type:'geopolitical',label:'Tim Hortons + BK / RBI inversion', desc:'3G Capital merges Burger King with Canadian Tim Hortons to form Restaurant Brands International, headquartered in Oakville, Ontario -- a tax inversion that moves a US QSR giant\'s tax domicile to Canada. Sets the M&A model later replicated for Popeyes acquisition (2017) and Firehouse Subs (2021).' },

  // ===== FRANCHISE LAW =====
  { year:1979, type:'regulation',  label:'FTC Franchise Rule',               desc:'FTC issues the Franchise Disclosure Rule (16 CFR 436), requiring franchisors to provide a Franchise Disclosure Document (FDD) before any sale. Standardizes US franchise law. Forces transparency about fees, litigation history, financial performance representations. The legal scaffolding that makes modern QSR franchising work -- and that franchisees use to sue.' },
  { year:2014, type:'labor',       label:'NLRB joint-employer ruling',       desc:'NLRB general counsel rules McDonald\'s can be held jointly liable as employer of franchisee workers -- threatening the corporate-vs-franchisee firewall that protects parent companies from labor liability. Trump-era NLRB reverses in 2017, Biden-era reinstates in 2023. The single most contested labor-law question in QSR.' },

  // ===== AUTOMATION / AI =====
  { year:2018, type:'technology',  label:'Flippy debuts at CaliBurger',      desc:'Miso Robotics installs Flippy, the first commercial autonomous burger-flipping robot, at CaliBurger in Pasadena. White Castle expands Flippy 2 to 100+ locations by 2022. Kitchen automation moves from concept to deployment. Currently slower and more expensive than humans -- but the cost curve is the story.' },
  { year:2021, type:'technology',  label:'Sweetgreen Infinite Kitchen',      desc:'Sweetgreen acquires Spyce (MIT-founded robot kitchen). 2023: first "Infinite Kitchen" stores open -- fully automated salad assembly. Chipotle responds with Autocado (avocado prep) and Chippy (tortilla chips). The bowl-and-salad fast casual category becomes the lead test bed for full kitchen automation.' },
  { year:2024, type:'technology',  label:'Drive-thru AI voice ordering',     desc:'McDonald\'s ends IBM Watson drive-thru AI pilot after embarrassing failures. Wendy\'s FreshAI (Google Cloud) continues at scale. Bojangles, Carl\'s Jr, Hardee\'s deploy AI voice ordering. The labor-replacement target is the drive-thru order-taker -- ~30% of QSR labor hours. Quality still mixed, but the deployment direction is set.' },

  // ===== FAST CASUAL BREAKAWAY =====
  { year:2007, type:'industry',    label:'Fast casual codified',             desc:'Technomic formally defines "fast casual" as a category: $9-15 ticket, made-to-order, no table service. Chipotle, Panera, Five Guys, Qdoba consolidate the niche. By the 2010s, fast casual outpaces traditional QSR in growth. Pulls health-conscious and higher-income diners out of the McDonald\'s/BK customer base permanently.' },
  { year:2015, type:'industry',    label:'Casual dining shrinkage begins',   desc:'Applebee\'s, Ruby Tuesday, TGI Friday\'s, Bennigan\'s, Buca di Beppo begin sustained net store closures. Casual-dining lost market share migrates to fast casual + premium QSR (Chipotle, Chick-fil-A, Shake Shack). The death of casual dining is QSR\'s tailwind.' },
];

// compute fields
chains.forEach(c => {
  c.end = c.closed || YEAR_END;
  c.duration = c.end - c.founded;
  c.dead = !!c.closed;
});

// =============================================================================
// YEAR-RESOLUTION HELPERS
// =============================================================================
// These resolve point-in-time data for views that are time-aware (snapshot,
// tooltip when called with contextYear, ownership-segmented radial spokes).
// All return null gracefully when the chain has no data for the requested
// metric or the year is out of bounds. Callers should handle null.
// =============================================================================

// Returns the headquarters entry active in a given year, or null if no hq
// data exists for this chain. If `year` is past the final hq period (e.g.,
// hq[].to was set to a transition year and the company hasn't moved since),
// returns the last entry rather than null -- handles "still based there"
// without requiring you to update the to=2026 every year.
//
// Used by:
//   - tooltip's tip-locations block (HQ row)
//   - snapshot card's HQ line
//   - future MAP view will use this to resolve which state to light up
function resolveHq(chain, year) {
  if (!chain.hq || !chain.hq.length) return null;
  for (const h of chain.hq) {
    if (year >= h.from && year < h.to) return h;
  }
  // year is past the last known hq period -- return the last entry
  return chain.hq[chain.hq.length - 1];
}

// Linear-interpolates franchise count between known data points. Franchise
// data in chains[].franchises is SPARSE -- typically 5-8 milestone points
// per brand, not annual figures. This function lets the UI smoothly resolve
// "approximately how many locations did Brand X have in 1985?" even if 1985
// isn't a recorded data point.
//
// Returns null if:
//   - chain has no franchise data
//   - year is before founded or after closed
//
// IMPORTANT: interpolated values are FAKE PRECISION. The franchiseDataAt()
// wrapper exposes a `reported` flag to distinguish real data points from
// interpolated ones, so the UI can mark them visually (● vs ~).
//
// If you add denser annual franchise data later (from 10-K filings etc.),
// this function still works correctly -- it just interpolates over shorter
// gaps.
function franchiseCountAt(chain, year) {
  if (!chain.franchises || !chain.franchises.length) return null;
  if (year < chain.founded || year > chain.end) return null;
  const pts = chain.franchises;
  if (year <= pts[0].year) return pts[0].count;
  if (year >= pts[pts.length - 1].year) return pts[pts.length - 1].count;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (year >= a.year && year <= b.year) {
      const t = (year - a.year) / (b.year - a.year);
      return Math.round(a.count + t * (b.count - a.count));
    }
  }
  return null;
}

// Wrapper around franchiseCountAt that returns extra metadata for honest UI:
//   count:     interpolated count for `year`
//   reported:  true ONLY if `year` matches an exact data point in chain.franchises[]
//              -- snapshot cards mark these with ● (bold/colored) vs ~ (italic/dim)
//   prevCount: count for year-1 (also possibly interpolated)
//   delta:     count - prevCount, used for the YoY change pill on snapshot cards
//
// Returns null if no data exists at the queried year.
//
// Note: when `prevCount` itself is interpolated, the delta will be the slope of
// the interpolation -- constant across the gap between known points. This is
// expected and is exactly why we mark it visually as approximate.
function franchiseDataAt(chain, year) {
  const count = franchiseCountAt(chain, year);
  if (count == null) return null;
  const prevCount = franchiseCountAt(chain, year - 1);
  const reported = chain.franchises.some(p => p.year === year);
  const delta = prevCount != null ? count - prevCount : null;
  return { count, reported, prevCount, delta };
}

// Compact number formatter for display in tight spaces (bar labels, snapshot
// cards). 24500 -> '24.5K', 1200000 -> '1.2M'. Strips trailing '.0'.
function fmtCount(n) {
  if (n == null) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// =============================================================================
// CENTRAL DISPATCHER
// =============================================================================
// Anytime filter, sort, search, or zoom state changes, call rerender(). It:
//   1. Invalidates the getSorted() memoization cache
//   2. Calls the render function for whichever tab is currently active
//
// USE THIS instead of calling render() directly. There used to be a bug where
// toggling category filters only re-rendered the timeline view; the radial
// and snapshot views silently kept showing stale data. rerender() fixes that
// once and for all.
//
// If you add a new view/tab, add another `else if (activeTab === '...')`
// branch below.
// =============================================================================
function rerender() {
  invalidateSortCache();
  if (activeTab === 'timeline')  render();
  else if (activeTab === 'lifespan')  renderLifespan(false);
  else if (activeTab === 'graveyard') renderLifespan(true);

}

// =============================================================================
// RADIAL METRIC REGISTRY
// =============================================================================
// The radial view's spoke length encodes whichever metric is selected here.
// To add a new metric (e.g., 'stockValue', 'employeeCount', 'avgSalesPerStore'),
// add an entry to this object and it will automatically appear as a button in
// the hamburger menu's RADIAL METRIC section. The button-builder loop lives a
// few lines below this and reads from this registry at script-init time.
//
// Each metric is a plain object with four fields:
//
//   label:     Display label for the menu button. ALL CAPS by convention.
//
//   valueOf:   (chain) => number | null
//              Extracts the numeric value from a chain. RETURN NULL if the
//              chain has no data for this metric -- chains returning null are
//              filtered out of the radial view entirely (per Blue's directive
//              to "trim out the ones we don't have data for"). This means a
//              new metric can launch with sparse data and gracefully hide the
//              gaps.
//
//   ticks:     [n, n, n, n]
//              Values at which to draw concentric reference rings on the chart.
//              Pick rings that span the realistic range of your metric.
//
//   tickLabel: (n) => string
//              Renders each ring's label. Use this to format units, e.g.
//              '24K' instead of '24000', or '8x' for ownership-change counts.
//
// IMPORTANT: This registry MUST be defined before the metric-switcher button-
// builder runs. There used to be a temporal dead zone bug where the registry
// was declared lower in the file -- moving it above the button setup fixed it.
// Don't move it back without checking the order of execution.
// =============================================================================
const radialMetrics = {

  ownership: {

    ticks: [1000, 5000, 15000, 40000],
    tickLabel: v => v >= 1000 ? (v/1000) + 'K' : v,

};

// =============================================================================
// TIMELINE VIEW + getSorted() MEMOIZATION
// =============================================================================
// getSorted() is the single source of truth for "which chains, in what order,
// matter right now." Used by TIMELINE; LIFESPAN/GRAVEYARD/SNAPSHOT each filter
// chains independently so they don't currently call this. Memoized because
// switching tabs back and forth shouldn't re-filter 143 chains every time.
//
// MUST CALL invalidateSortCache() WHEN:
//   - sortMode changes
//   - searchQuery changes
//   - activeFilters changes (any cat toggled)
// rerender() handles all three. If you wire new state into the sort/filter
// logic, also add it to getCacheKey() so the memoization recognizes when to
// invalidate.
// =============================================================================

function getSorted() {
  const key = getCacheKey();
  if (_sortedCache && _sortedKey === key) {
    searchCount.textContent = searchQuery ? _sortedCache.length + ' RESULTS' : '';
    return _sortedCache;
  }
  let arr = chains.filter(c => activeFilters.has(c.cat));
  if (searchQuery) {
    arr = arr.filter(c =>
      c.name.toLowerCase().includes(searchQuery) ||
      (c.desc && c.desc.toLowerCase().includes(searchQuery)) ||
      (c.tagline && c.tagline.toLowerCase().includes(searchQuery))
    );
  }
  searchCount.textContent = searchQuery ? arr.length + ' RESULTS' : '';
  if (sortMode === 'duration') arr.sort((a,b) => b.duration - a.duration || a.founded - b.founded);
  else if (sortMode === 'founded') arr.sort((a,b) => a.founded - b.founded);
  else if (sortMode === 'name') arr.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortMode === 'cat') arr.sort((a,b) => a.cat.localeCompare(b.cat) || a.founded - b.founded);
  _sortedCache = arr;
  _sortedKey = key;
  return arr;
}

// world-coord helper: convert year value to x-pixel position on the timeline.
function yearToPx(y) { return (y - YEAR_START) * pxPerYear; }

// =============================================================================
// PERFORMANCE TRICK: GRID LINES AS CSS GRADIENT (don't undo this)
// =============================================================================
// The original code drew 30+ absolutely-positioned <div>s per row to render
// year tick lines. With 143 chains x 30 ticks = 4290 extra DOM nodes per
// timeline render. Killed scroll perf and made re-renders sluggish.
//
// This function builds a layered CSS repeating-linear-gradient that draws
// the same grid as a single background-image on each row's track. Two layers:
//   - thin lines every 5 years (subtle)
//   - bolder lines every 10 years (decade markers)
// Zero DOM nodes added. Re-rendered automatically when pxPerYear changes.
// =============================================================================
function buildGridBg() {
  const step = pxPerYear * 5;
  const decade = pxPerYear * 10;
  return (
    `repeating-linear-gradient(to right,#e8dfc8 0,#e8dfc8 1px,transparent 1px,transparent ${step}px),` +
    `repeating-linear-gradient(to right,rgba(200,176,128,0.35) 0,rgba(200,176,128,0.35) 1px,transparent 1px,transparent ${decade}px)`
  );
}

// memoization storage. _sortedCache is the last result; _sortedKey is what
// inputs produced it. invalidateSortCache() should be called after any state
// change that affects filter/sort outputs.
let _sortedCache = null, _sortedKey = '';
function getCacheKey() {
  return sortMode + '|' + searchQuery + '|' + [...activeFilters].sort().join(',');
}
function invalidateSortCache() { _sortedCache = null; _sortedKey = ''; }

// =============================================================================
// TIMELINE render() -- horizontal Gantt-style chart
// =============================================================================
// Builds the entire timeline DOM in a DocumentFragment, then commits it via
// chart.replaceChildren(frag) -- single layout pass per render, no incremental
// appendChild thrashing.
//
// For each chain in the sorted list:
//   - sticky-positioned label column on the left (chain name + years)
//   - track containing the colored bar (founded -> end of life)
//   - if chain has ownership[] data, a thinner ribbon below the bar showing
//     parent-company eras as connected colored segments with subtle transitions
//
// Grid background is the CSS gradient (see buildGridBg above). Bar labels
// include current location count in the format "1955  McDonald's  43.5K"
// when chain.franchises has data.
// =============================================================================
function render() {
  const sorted = getSorted();
  const chart = document.getElementById('chart');
  const totalPx = (YEAR_END - YEAR_START) * pxPerYear;
  const gridBg = buildGridBg();

  const frag = document.createDocumentFragment();

  // axis
  const axis = document.createElement('div');
  axis.id = 'axis-row';
  for (let y = YEAR_START; y <= YEAR_END; y++) {
    const tick = document.createElement('div');
    tick.className = 'year-tick' + (y % 10 === 0 ? ' decade' : '');
    tick.style.width = pxPerYear + 'px';
    if (y % 10 === 0) tick.textContent = y;
    axis.appendChild(tick);
  }
  frag.appendChild(axis);

  sorted.forEach(chain => {
    const color = cats[chain.cat]?.color || '#888';
    const hasRibbon = chain.ownership && chain.ownership.length > 0;
    const rowH = hasRibbon ? 42 : 28;

    const row = document.createElement('div');
    row.className = 'row' + (chain.dead ? ' dead' : '');
    row.style.minHeight = rowH + 'px';

    // label
    const label = document.createElement('div');
    label.className = 'row-label';
    label.style.minHeight = rowH + 'px';
    label.innerHTML =
      `<span class="lname"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:4px;vertical-align:middle;flex-shrink:0"></span>${chain.name}</span>` +
      `<span class="lyear">${chain.founded}${chain.closed ? ' - '+chain.closed : ' - now'}</span>` +
      (chain.ownership ? `<span class="lacq">${chain.ownership.length} OWNERS</span>` : '');
    label.addEventListener('click', () => showTip(chain, null));
    row.appendChild(label);

    // track -- grid drawn via repeating gradient instead of ~30 grid-line divs
    const track = document.createElement('div');
    track.className = 'row-track' + (hasRibbon ? ' has-ribbon' : '');
    track.style.width = totalPx + 'px';
    track.style.minHeight = rowH + 'px';
    track.style.backgroundImage = gridBg;

    // main bar
    const bar = document.createElement('div');
    bar.className = 'bar' + (chain.dead ? ' dead' : '');
    const left = yearToPx(chain.founded);
    const width = Math.max(pxPerYear, yearToPx(chain.end) - left);
    bar.style.left = left + 'px';
    bar.style.width = width + 'px';
    bar.style.background = color;
    const bl = document.createElement('span');
    bl.className = 'bar-label';
    const currentCount = franchiseCountAt(chain, chain.end);
    bl.textContent = chain.founded + '  ' + chain.name + (currentCount != null ? '  ' + fmtCount(currentCount) : '');
    bar.appendChild(bl);
    bar.addEventListener('click', e => { e.stopPropagation(); showTip(chain, null); });
    track.appendChild(bar);

    // ownership ribbon
    if (hasRibbon) {
      const ribbon = document.createElement('div');
      ribbon.className = 'ribbon';
      const ownStart = chain.ownership[0].from;
      const ownEnd = chain.ownership[chain.ownership.length - 1].to;
      ribbon.style.left = yearToPx(ownStart) + 'px';
      ribbon.style.width = Math.max(4, yearToPx(ownEnd) - yearToPx(ownStart)) + 'px';

      chain.ownership.forEach((own, idx) => {
        const seg = document.createElement('div');
        seg.className = 'ribbon-seg';
        const segW = Math.max(2, yearToPx(own.to) - yearToPx(own.from));
        seg.style.width = segW + 'px';
        seg.style.background = own.color;
        seg.style.flexShrink = '0';

        if (pxPerYear >= 6 && segW > 30) {
          const lbl = document.createElement('span');
          lbl.className = 'ribbon-seg-label';
          lbl.textContent = own.owner;
          seg.appendChild(lbl);
        }

        if (idx < chain.ownership.length - 1) {
          const div = document.createElement('div');
          div.className = 'ribbon-div';
          div.style.borderLeftColor = own.color;
          seg.appendChild(div);
        }

        seg.addEventListener('click', e => { e.stopPropagation(); showTip(chain, own); });
        ribbon.appendChild(seg);
      });
      track.appendChild(ribbon);
    }

    row.appendChild(track);
    frag.appendChild(row);
  });

  // ---- world events band ----
  // Appended to the chart as the last row. position:sticky on bottom of #chart-wrap
  // keeps it visible while you scroll the chains. Year-aligned with the same
  // pxPerYear scale as the chart. Tap a tick for the event detail popup.
  const eventsRow = document.createElement('div');
  eventsRow.id = 'events-row';
  eventsRow.style.width = totalPx + 'px';

  const eLbl = document.createElement('div');
  eLbl.className = 'events-label';
  eLbl.innerHTML = `<span class="el-title">WORLD EVENTS</span><span class="el-sub">${worldEvents.length} shocks · tap a tick</span>`;
  eventsRow.appendChild(eLbl);

  worldEvents.forEach(ev => {
    if (ev.year < YEAR_START || ev.year > YEAR_END) return;
    const t = eventTypes[ev.type] || { color:'#888' };
    const tick = document.createElement('div');
    tick.className = 'event-tick';
    // alternate tick heights to reduce overlap when multiple events share a year
    const taller = (ev.year % 2 === 0);
    if (taller) tick.classList.add('tall');
    tick.style.left = ((ev.year - YEAR_START) * pxPerYear - 1) + 'px';
    tick.style.background = t.color;
    tick.title = `${ev.year} · ${ev.label}`;
    tick.addEventListener('click', e => {
      e.stopPropagation();
      openEventPopup(ev);
    });
    eventsRow.appendChild(tick);
  });

  frag.appendChild(eventsRow);

  chart.replaceChildren(frag);
}

// event popup show/hide
function openEventPopup(ev) {
  const pop = document.getElementById('event-popup');
  const t = eventTypes[ev.type] || { color:'#888', label:ev.type.toUpperCase() };
  document.getElementById('ep-year').textContent = ev.year;
  const typeEl = document.getElementById('ep-type');
  typeEl.textContent = t.label;
  typeEl.style.background = t.color;
  document.getElementById('ep-title').textContent = ev.label;
  document.getElementById('ep-desc').textContent = ev.desc;
  pop.classList.add('open');
}
// close on its own click handlers (wired below after DOM exists)

// tooltip
const tooltip = document.getElementById('tooltip');

// =============================================================================
// TOOLTIP / DETAIL PANEL  (showTip)
// =============================================================================
// Renders the floating panel at bottom of screen with full chain details.
// Three call signatures:
//   showTip(chain)
//      - generic info, contextYear defaults to chain.end (today for live brands,
//        close year for dead ones)
//   showTip(chain, ownershipEntry)
//      - same, but highlights a specific ownership era (used by ribbon segment
//        clicks on timeline view)
//   showTip(chain, null, contextYear)
//      - resolves time-aware fields (HQ, location count) at the requested year.
//        Used by SNAPSHOT cards so the panel matches the slider year.
//
// Sections rendered (graceful no-op when data absent):
//   tip-name, tip-tagline           always
//   tip-meta                        always (cat, founded, closed/active, duration)
//   tip-locations                   ORIGIN, HQ@year, LOCATIONS@year, sparkline,
//                                    CEO, CHAIR, FOUNDER, leadership notes
//   tip-desc                        prose description
//   tip-own-chain                   per-owner timeline strip
//   tip-eras                        decade narrative blurbs
//
// Tooltip is a SHARED single DOM element. There used to be a bug where the
// tooltip's children rendered without a wrapper -- fixed by wrapping in a
// <div id="tooltip">. The tooltip also stops click propagation so taps inside
// don't trigger the document-level "close tooltip" handler.
// =============================================================================
function showTip(chain, selectedOwn, contextYear) {
  const color = cats[chain.cat]?.color || '#c8940a';
  // year context for resolved fields. snapshot view passes its slider year;
  // other views default to chain.end (current year if alive, closing year if dead).
  const yr = contextYear != null ? contextYear : chain.end;

  document.getElementById('tip-name').textContent = chain.name;
  document.getElementById('tip-name').style.color = color;
  document.getElementById('tip-tagline').textContent = chain.tagline || '';
  document.getElementById('tip-meta').textContent =
    `${cats[chain.cat]?.label || chain.cat} // FOUNDED ${chain.founded} // ${chain.closed ? 'CLOSED ' + chain.closed : 'ACTIVE 2026'} // ${chain.duration} YRS`;

  // location + franchise block
  const locEl = document.getElementById('tip-locations');
  locEl.innerHTML = '';
  const rows = [];
  if (chain.origin) {
    rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">ORIGIN</span><span class="tip-loc-value">${chain.origin.city}, ${chain.origin.state}</span></div>`);
  }
  if (chain.hq && chain.hq.length) {
    const hq = resolveHq(chain, yr);
    if (hq) {
      const same = chain.origin && hq.city === chain.origin.city && hq.state === chain.origin.state;
      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">HQ ${yr}</span><span class="tip-loc-value">${hq.city}, ${hq.state}${same ? ' <span class="tip-loc-year">(same as origin)</span>' : ''}</span></div>`);
    }
  }
  if (chain.franchises && chain.franchises.length) {
    const count = franchiseCountAt(chain, yr);
    if (count != null) {
      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">LOCATIONS ${yr}</span><span class="tip-loc-value">${count.toLocaleString()}</span></div>`);
    }
    // mini sparkline of known data points
    const spark = chain.franchises.map(p => `${p.year}:${fmtCount(p.count)}`).join('  ');
    rows.push(`<div class="tip-franchise-spark">${spark}</div>`);
  }
  // leadership
  if (chain.leadership) {
    const L = chain.leadership;
    if (L.ceo)      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">CEO</span><span class="tip-loc-value">${L.ceo}</span></div>`);
    if (L.chair && L.chair !== L.ceo)
                    rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">CHAIR</span><span class="tip-loc-value">${L.chair}</span></div>`);
    if (L.founder)  rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">FOUNDER</span><span class="tip-loc-value">${L.founder}</span></div>`);
    if (L.notes)    rows.push(`<div class="tip-franchise-spark" style="font-style:italic">${L.notes}</div>`);
  }
  // menu photos across the years, if this entry has them
  if (chain.menus && chain.menus.length) {
    rows.push('<div class="tip-loc-row"><span class="tip-loc-label">MENUS ON FILE</span></div>');
    rows.push('<div style="display:flex;gap:6px;overflow-x:auto;padding:4px 0">' + chain.menus.map(m =>
      `<a href="${m.photo}" target="_blank" style="flex:0 0 auto;text-align:center;text-decoration:none;color:inherit">` +
      `<img src="${m.photo}" loading="lazy" alt="Menu ${m.year}" style="height:120px;width:auto;border:1px solid #ccc;border-radius:3px;display:block" onerror="this.parentNode.style.display='none'">` +
      `<div style="font-size:11px">${m.year}</div></a>`).join('') + '</div>');
  }
  locEl.innerHTML = rows.join('');

  document.getElementById('tip-desc').textContent = chain.desc || '';

  // ownership chain summary
  const ownEl = document.getElementById('tip-own-chain');
  ownEl.innerHTML = '';
  if (chain.ownership && chain.ownership.length > 0) {
    const div = document.createElement('div');
    div.className = 'own-chain';
    const title = document.createElement('div');
    title.className = 'own-chain-title';
    title.textContent = 'OWNERSHIP CHAIN';
    div.appendChild(title);
    chain.ownership.forEach(own => {
      const r = document.createElement('div');
      r.className = 'own-chain-row';
      if (selectedOwn && own === selectedOwn) r.style.fontWeight = 'bold';
      r.innerHTML = `<span class="own-dot" style="background:${own.color}"></span><span>${own.owner}</span><span class="own-years">${own.from} - ${own.to}</span>`;
      r.addEventListener('click', e => { e.stopPropagation(); showTip(chain, own); });
      div.appendChild(r);
    });
    ownEl.appendChild(div);
  }

  // era details
  const eraEl = document.getElementById('tip-eras');
  eraEl.innerHTML = '';
  const eraSource = selectedOwn ? chain.eras : chain.eras;
  if (eraSource) {
    const block = document.createElement('div');
    block.className = 'era-block';
    Object.entries(eraSource).sort((a,b) => a[0]-b[0]).forEach(([decade, text]) => {
      const d = document.createElement('div');
      d.className = 'era-decade';
      d.textContent = decade + 's';
      const t = document.createElement('div');
      t.className = 'era-text';
      t.textContent = text;
      block.appendChild(d);
      block.appendChild(t);
    });
    eraEl.appendChild(block);
  }

  tooltip.style.display = 'block';
}

document.getElementById('tip-close').addEventListener('click', e => { e.stopPropagation(); tooltip.style.display = 'none'; });
// clicks inside the tooltip should not close it -- only outside clicks do.
tooltip.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { tooltip.style.display = 'none'; });

// world events popup
const eventPopup = document.getElementById('event-popup');
document.getElementById('ep-close').addEventListener('click', e => { e.stopPropagation(); eventPopup.classList.remove('open'); });
eventPopup.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { eventPopup.classList.remove('open'); });

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    rerender();
  });
