<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSR TIMELINE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,600;1,400&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #f0e8d5;
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }

  #header {
    position: sticky; top: 0; z-index: 60;
    background: #f0e8d5;
    border-bottom: 2px solid #c8940a;
    padding: 6px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  #header h1 { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#b87000; letter-spacing:0.2em; white-space:nowrap; }
  #header .sub { font-size:10px; color:#a08040; letter-spacing:0.12em; overflow:hidden; text-overflow:ellipsis; }

  /* hamburger button -- lives inside header */
  #menu-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    background: #c8940a; border: none; border-radius: 4px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
  }
  #menu-btn span {
    display: block; width: 18px; height: 2px;
    background: #fff; border-radius: 1px;
    transition: all 0.2s;
  }
  #menu-btn.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-btn.open span:nth-child(2) { opacity: 0; }
  #menu-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* slide-in panel -- left side, scaled down ~20% */
  #menu-panel {
    position: fixed; top: 0; left: -260px; width: 240px; height: 100vh;
    background: #fffdf5; border-right: 2px solid #c8940a;
    z-index: 79; overflow-y: auto;
    transition: left 0.25s ease;
    padding: 52px 12px 20px;
    box-shadow: 4px 0 20px rgba(0,0,0,0.12);
    font-size: 90%;
  }
  #menu-panel.open { left: 0; }

  .menu-section { margin-bottom: 16px; }
  .menu-section-title {
    font-size: 9px; color: #8a6e3a; letter-spacing: 0.18em;
    margin-bottom: 6px; border-bottom: 1px solid #e0d0a0; padding-bottom: 3px;
  }

  /* search box */
  #search-box {
    width: 100%; padding: 5px 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    border: 1px solid #c8a060; border-radius: 3px;
    background: #fff8ec; color: #3a2a10;
    outline: none; letter-spacing: 0.04em;
  }
  #search-box:focus { border-color: #c8940a; }
  #search-count { font-size: 9px; color: #8a6e3a; margin-top: 4px; letter-spacing: 0.08em; }
  .search-highlight { background: #fff3cc !important; }

  /* sort buttons inside panel */
  .sort-btn {
    font-family:'Share Tech Mono',monospace; font-size:10px; color:#8a6e3a;
    background:#fff8ec; border:1px solid #c8a060; border-radius:3px;
    padding:4px 10px; cursor:pointer; letter-spacing:0.06em; white-space:nowrap;
    transition:background 0.15s,color 0.15s;
  }
  .sort-btn.active, .sort-btn:hover { background:#c8940a; color:#fff; border-color:#c8940a; }

  #zoom-slider { width:140px; accent-color:#c8940a; cursor:pointer; }
  #zoom-val { font-size:10px; color:#c8940a; letter-spacing:0.05em; }

  /* cat filters inside panel */
  .cat-filter {
    font-family:'Share Tech Mono',monospace; font-size:10px;
    padding:3px 8px; border-radius:3px; border:1px solid;
    cursor:pointer; letter-spacing:0.04em; white-space:nowrap;
    transition:opacity 0.15s; display:flex; align-items:center; gap:5px;
  }
  .cat-filter.off { opacity:0.3; }

  /* overlay behind panel */
  #menu-overlay {
    display: none; position: fixed; inset: 0; z-index: 78;
    background: rgba(0,0,0,0.15);
  }
  #menu-overlay.open { display: block; }
  #chart-wrap { overflow:auto; max-height:calc(100vh - 88px); padding-bottom:46px; }

  /* world events band -- sticky to bottom of chart-wrap viewport, aligned to year axis */
  #events-row {
    position:sticky; bottom:0; z-index:18;
    background:rgba(245,238,219,0.97);
    border-top:2px solid #c8a060;
    margin-left:160px;
    height:46px;
    backdrop-filter:blur(2px);
  }
  #events-row .events-label {
    position:absolute; left:-160px; top:0; bottom:0; width:160px;
    background:#f0e8d5; border-right:2px solid #ddd0a0;
    font-size:9px; color:#5a4010; padding:6px 10px;
    font-family:'Share Tech Mono',monospace; letter-spacing:0.08em;
    display:flex; flex-direction:column; justify-content:center;
  }
  #events-row .events-label .el-title { font-weight:bold; font-size:10px; }
  #events-row .events-label .el-sub { font-size:8px; opacity:0.7; margin-top:2px; }
  .event-tick {
    position:absolute; top:6px; bottom:6px; width:3px;
    border-radius:2px; cursor:pointer;
    transition:transform 0.1s, filter 0.1s;
  }
  .event-tick:hover { transform:scaleX(2.5); filter:brightness(1.15); }
  .event-tick.tall { top:2px; }

  /* event detail popup -- appears above the band when a tick is tapped */
  #event-popup {
    position:fixed; bottom:54px; left:50%; transform:translateX(-50%);
    background:#fffdf5; border:2px solid #c8940a;
    padding:11px 14px; max-width:380px; width:92vw;
    border-radius:6px; box-shadow:0 6px 28px rgba(0,0,0,0.15);
    display:none; z-index:201; max-height:40vh; overflow-y:auto;
    contain:layout style;
  }
  #event-popup.open { display:block; }
  #event-popup .ep-close { position:absolute; top:6px; right:10px; font-size:16px; color:#bbb; cursor:pointer; font-weight:bold; }
  #event-popup .ep-year { font-family:'Share Tech Mono',monospace; font-size:11px; color:#8a6e3a; letter-spacing:0.1em; }
  #event-popup .ep-type { display:inline-block; font-size:9px; padding:2px 7px; border-radius:8px; color:#fff; font-family:'Share Tech Mono',monospace; letter-spacing:0.08em; margin-left:6px; vertical-align:1px; }
  #event-popup .ep-title { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#3a2a10; margin:4px 0 6px; letter-spacing:0.02em; }
  #event-popup .ep-desc { font-family:'Lora',serif; font-size:12px; color:#3a2a10; line-height:1.45; }

  #axis-row {
    position:sticky; top:0; z-index:20;
    background:#f8f2e4; border-bottom:2px solid #c8a060;
    display:flex; margin-left:160px;
  }
  .year-tick {
    font-size:9px; color:#8a6e3a; text-align:center;
    border-left:1px solid #e0d4b0; padding:3px 0;
    flex-shrink:0; overflow:hidden; white-space:nowrap;
  }
  .year-tick.decade { border-left-color:#c8a060; color:#5a4010; font-weight:bold; }

  /* rows */
  .row {
    display:flex; align-items:flex-start;
    border-bottom:1px solid #e8dfc8;
    contain:layout style;
  }
  .row:hover { background:rgba(200,148,10,0.04); }

  .row-label {
    width:160px; min-width:160px;
    padding:4px 6px 4px 10px;
    position:sticky; left:0;
    background:#f0e8d5; z-index:10;
    border-right:2px solid #ddd0a0;
    cursor:pointer;
    min-height:32px;
  }
  .row-label .lname { font-size:10px; color:#3a2a10; display:block; line-height:1.3; letter-spacing:0.02em; }
  .row-label .lyear { font-size:9px; color:#8a6e3a; display:block; }
  .row-label .lacq  { font-size:8px; color:#7744bb; display:block; letter-spacing:0.04em; }
  .row.dead .row-label .lname { color:#999; text-decoration:line-through; text-decoration-color:#bbb; }

  .row-track { flex:1; position:relative; background-repeat:repeat-y; background-position:0 0; }
  /* height depends on whether ownership ribbon exists */
  .row-track.has-ribbon { padding-bottom:10px; }

  /* main bar */
  .bar {
    position:absolute; top:4px; height:16px;
    border-radius:3px; cursor:pointer;
    display:flex; align-items:center; padding:0 5px;
    overflow:hidden;
    transition:height 0.12s, filter 0.12s;
    z-index:3;
  }
  .bar:hover { height:20px; filter:brightness(1.1); z-index:5; }
  .bar.dead {
    background-image:repeating-linear-gradient(
      45deg, transparent, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 6px
    ) !important;
    opacity:0.6;
  }
  .bar-label {
    font-size:9px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.95);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,0.45);
  }

  /* ownership ribbon */
  .ribbon {
    position:absolute; top:24px; height:8px; z-index:2;
    display:flex; align-items:center; overflow:hidden;
    border-radius:1px;
  }
  .ribbon-seg {
    height:100%; cursor:pointer;
    position:relative; overflow:hidden;
    transition:filter 0.12s;
    display:flex; align-items:center;
  }
  .ribbon-seg:hover { filter:brightness(1.2); z-index:4; }
  .ribbon-seg-label {
    font-size:7px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.9); white-space:nowrap;
    overflow:hidden; padding:0 2px;
    pointer-events:none; text-shadow:0 1px 1px rgba(0,0,0,0.5);
  }
  /* divider triangle between ownership segments */
  .ribbon-div {
    position:absolute; top:0; right:-4px;
    width:0; height:0;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
    border-left:4px solid;
    z-index:5; pointer-events:none;
  }

  /* tooltip / detail panel */
  #tooltip {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:#fffdf5; border:2px solid #c8940a;
    padding:13px 16px; max-width:380px; width:92vw;
    border-radius:6px; box-shadow:0 6px 28px rgba(0,0,0,0.15);
    display:none; z-index:200; max-height:50vh; overflow-y:auto;
    contain:layout style;
  }
  #tooltip h2 { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.1em; margin-bottom:2px; }
  #tooltip .tip-meta { font-size:10px; color:#8a6e3a; letter-spacing:0.1em; margin-bottom:7px; }
  #tooltip p { font-family:'Lora',serif; color:#3a2a10; font-size:12px; line-height:1.7; }
  #tooltip .tip-tagline { font-family:'Lora',serif; font-style:italic; color:#5a4a20; font-size:12px; margin-bottom:6px; }

  .own-chain { margin-top:10px; border-top:1px solid #e0d0a0; padding-top:8px; }
  .own-chain-title { font-size:9px; color:#8a6e3a; letter-spacing:0.12em; margin-bottom:5px; }
  .own-chain-row {
    display:flex; align-items:center; gap:6px;
    font-size:10px; color:#3a2a10; padding:2px 0;
    cursor:pointer;
  }
  .own-chain-row:hover { color:#b87000; }
  .own-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .own-years { color:#8a6e3a; font-size:9px; white-space:nowrap; }

  .era-block { margin-top:8px; border-top:1px solid #e0d0a0; padding-top:6px; }
  .era-decade { font-size:9px; color:#c8940a; letter-spacing:0.1em; margin-bottom:2px; }
  .era-text { font-family:'Lora',serif; font-size:11px; color:#3a2a10; line-height:1.6; margin-bottom:6px; }

  #tip-close { position:absolute; top:7px; right:11px; font-size:17px; color:#bbb; cursor:pointer; font-weight:bold; }

  #tip-locations { margin:6px 0 8px; }
  #tip-locations:empty { display:none; }
  .tip-loc-row { display:flex; gap:8px; font-size:10px; color:#3a2a10; padding:2px 0; align-items:baseline; }
  .tip-loc-label { font-size:8px; color:#8a6e3a; letter-spacing:0.12em; min-width:54px; flex-shrink:0; padding-top:1px; }
  .tip-loc-value { font-family:'Lora',serif; color:#3a2a10; }
  .tip-loc-year { color:#8a6e3a; font-size:9px; }
  .tip-franchise-spark { font-size:9px; color:#8a6e3a; margin-top:2px; font-family:'Share Tech Mono',monospace; }

  /* tabs */
  #tab-bar {
    display: flex; gap: 2px;
    background: #e0d4b0;
    border-bottom: 2px solid #c8940a;
    padding: 0 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  #tab-bar::-webkit-scrollbar { display:none; }
  .tab-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: #8a6e3a; background: transparent;
    border: none; border-bottom: 3px solid transparent;
    padding: 7px 12px 5px; cursor: pointer; white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active { color: #b87000; border-bottom-color: #c8940a; background: #f0e8d5; }
  .tab-btn:hover { color: #b87000; }

  /* lifespan view */
  #lifespan-wrap { overflow-y: auto; max-height: calc(100vh - 88px); }
  .ls-row { display:flex; align-items:center; border-bottom:1px solid #e8dfc8; min-height:26px; }
  .ls-row:hover { background:rgba(200,148,10,0.04); }
  .ls-label {
    width:160px; min-width:160px; padding:3px 6px 3px 10px;
    position:sticky; left:0; background:#f0e8d5;
    border-right:2px solid #ddd0a0; cursor:pointer;
  }
  .ls-label .lname { font-size:10px; color:#3a2a10; display:block; line-height:1.3; }
  .ls-label .lyrs  { font-size:9px; color:#8a6e3a; display:block; }
  .ls-row.dead .ls-label .lname { color:#999; text-decoration:line-through; text-decoration-color:#bbb; }
  .ls-track { flex:1; padding:4px 8px; }
  .ls-bar {
    height:16px; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; padding:0 6px;
    transition:filter 0.12s, height 0.12s; min-width:4px;
    overflow:hidden;
  }
  .ls-bar:hover { filter:brightness(1.1); height:20px; }
  .ls-bar.dead {
    background-image:repeating-linear-gradient(
      45deg,transparent,transparent 3px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0.18) 6px
    ) !important; opacity:0.6;
  }
  .ls-bar-label {
    font-size:9px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.95); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  #ls-axis, #gy-axis {
    display:flex; margin-left:160px;
    background:#f8f2e4; border-bottom:2px solid #c8a060;
    position:sticky; top:0; z-index:20;
  }
  .ls-tick {
    font-size:9px; color:#8a6e3a; text-align:center;
    border-left:1px solid #e0d4b0; padding:3px 0;
    flex-shrink:0; white-space:nowrap; overflow:hidden;
  }
  .ls-tick.major { border-left-color:#c8a060; color:#5a4010; font-weight:bold; }

  /* snapshot view */
  #snapshot-wrap { overflow-y:auto; max-height:calc(100vh - 88px); }
  #snap-controls {
    padding:10px 14px; background:#f8f2e4;
    border-bottom:1px solid #ddd0a0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  #snap-year-display {
    font-family:'Bebas Neue',sans-serif; font-size:32px;
    color:#b87000; letter-spacing:0.1em; min-width:70px;
  }
  #snap-slider { flex:1; min-width:120px; accent-color:#c8940a; }
  .snap-stat { font-size:10px; color:#8a6e3a; letter-spacing:0.08em; }
  #snap-grid { display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px; }
  .snap-card {
    border-radius:5px; padding:7px 10px; cursor:pointer;
    min-width:130px; flex:1; border:1px solid;
    transition:filter 0.15s; max-width:200px;
  }
  .snap-card:hover { filter:brightness(0.94); }
  .snap-card .sc-name { font-size:11px; font-family:'Share Tech Mono',monospace; font-weight:bold; display:block; }
  .snap-card .sc-owner { font-size:9px; opacity:0.8; display:block; margin-top:2px; }
  .snap-card .sc-age  { font-size:9px; opacity:0.7; display:block; margin-top:1px; }
  .snap-card .sc-count { font-size:10px; opacity:0.95; display:block; margin-top:3px; font-weight:bold; }
  .snap-card .sc-count.interp { font-style:italic; opacity:0.7; font-weight:normal; }
  .snap-card .sc-marker { display:inline-block; width:11px; font-weight:bold; opacity:0.7; }
  .snap-card .sc-delta { font-size:9px; padding:1px 5px; margin-left:4px; border-radius:8px; font-weight:bold; }
  .snap-card .sc-delta.up   { background:rgba(0,128,0,0.18); color:#2a6a2a; }
  .snap-card .sc-delta.down { background:rgba(180,30,30,0.18); color:#8a2a2a; }
  .snap-card .sc-hq    { font-size:9px; opacity:0.7; display:block; margin-top:1px; }
</style>
</head>
<body>

<div id="header">
  <button id="menu-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <h1>QSR TIMELINE</h1>
  <input type="range" id="zoom-slider" min="2" max="32" value="8" step="1" style="width:90px;accent-color:#c8940a;cursor:pointer;flex-shrink:0;">
  <span id="zoom-val" style="font-size:10px;color:#c8940a;white-space:nowrap;flex-shrink:0;">8px/yr</span>
</div>

<div id="menu-overlay"></div>

<div id="menu-panel">
  <div class="menu-section">
    <div class="menu-section-title">SEARCH</div>
    <input type="search" id="search-box" placeholder="Type to filter..." autocomplete="off">
    <div id="search-count"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">SORT BY</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <button class="sort-btn" data-sort="duration">LIFESPAN</button>
      <button class="sort-btn active" data-sort="founded">YEAR FOUNDED</button>
      <button class="sort-btn" data-sort="name">NAME</button>
      <button class="sort-btn" data-sort="cat">CATEGORY</button>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">FILTER BY CATEGORY</div>
    <div id="cat-filters" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">RADIAL METRIC</div>
    <div style="font-size:9px;color:#7a5a20;margin-bottom:6px;line-height:1.5;">
      Spoke length on the RADIAL view encodes this metric. Chains without data are hidden.
    </div>
    <div id="radial-metric-buttons" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">OWNERSHIP RIBBON</div>
    <div style="font-size:10px;color:#5a4a20;line-height:1.6;">
      Colored strip below each bar shows parent company history. Tap a segment for that ownership era.
    </div>
  </div>
</div>

<div id="tab-bar">
  <button class="tab-btn active" data-tab="timeline">TIMELINE</button>
  <button class="tab-btn" data-tab="lifespan">LIFESPAN</button>
  <button class="tab-btn" data-tab="graveyard">GRAVEYARD</button>
  <button class="tab-btn" data-tab="snapshot">SNAPSHOT</button>
  <button class="tab-btn" data-tab="radial">RADIAL</button>
</div>

<div id="chart-wrap">
  <div id="chart"></div>
</div>

<div id="lifespan-wrap" style="display:none;">
  <div id="ls-axis"></div>
  <div id="ls-chart"></div>
</div>

<div id="graveyard-wrap" style="display:none; overflow-y:auto; max-height:calc(100vh - 88px);">
  <div id="gy-axis"></div>
  <div id="gy-chart"></div>
</div>

<div id="snapshot-wrap" style="display:none;">
  <div id="snap-controls">
    <div id="snap-year-display">2026</div>
    <input type="range" id="snap-slider" min="1880" max="2026" value="2026" step="1">
    <div>
      <div class="snap-stat" id="snap-alive-count"></div>
      <div class="snap-stat" id="snap-cat-count"></div>
    </div>
  </div>
  <div id="snap-grid"></div>
</div>

<div id="radial-wrap" style="display:none; overflow:auto; max-height:calc(100vh - 88px);">
  <canvas id="radial-canvas"></canvas>
</div>

<div id="tooltip">
  <span id="tip-close">x</span>
  <h2 id="tip-name"></h2>
  <div class="tip-tagline" id="tip-tagline"></div>
  <div class="tip-meta" id="tip-meta"></div>
  <div id="tip-locations"></div>
  <p id="tip-desc"></p>
  <div id="tip-own-chain"></div>
  <div id="tip-eras"></div>
</div>

<div id="event-popup">
  <span class="ep-close" id="ep-close">x</span>
  <span class="ep-year" id="ep-year"></span><span class="ep-type" id="ep-type"></span>
  <div class="ep-title" id="ep-title"></div>
  <div class="ep-desc" id="ep-desc"></div>
</div>

<script>
/* =============================================================================
 * QSR TIMELINE -- HANDOFF NOTES FOR THE NEXT BUILDER
 * =============================================================================
 *
 * This file is a self-contained HTML artifact. No build step, no external JS
 * dependencies beyond Google Fonts. Designed for Android mobile (Blue's primary
 * device) -- pinch/touch interactions, sticky controls, viewport-friendly sizing.
 *
 * --- DATA MODEL ---
 *
 * `chains` is an array of restaurant/QSR/adjacent-industry brand objects. Each
 * has `name`, `cat` (category key from `cats`), `founded` (year), `closed` (year
 * or null if active), `tagline`, `desc`. After load, a compute pass adds:
 *   .end       = closed || YEAR_END
 *   .duration  = end - founded
 *   .dead      = !!closed
 *
 * Optional fields, ALL of which gracefully degrade if absent:
 *
 *   origin:    { city, state }                       -- founding location
 *   hq:        [ { city, state, from, to } ]         -- headquarters by year
 *   franchises:[ { year, count } ]                   -- sparse location counts
 *   ownership: [ { owner, from, to, color } ]        -- corporate ownership eras
 *   eras:      { 1950: '...', 1970: '...' }          -- decade narrative blurbs
 *   leadership:{ ceo, chair, founder, notes }        -- current people
 *
 * Coverage status (as of last edit):
 *   - 143 chains total
 *   - 41 have ownership[]
 *   - 19 have franchises[]
 *   - 25 have leadership{}  (top-tier brands -- expand from here)
 *   - 25-ish have origin/hq (overlaps heavily with leadership)

 * --- VIEWS ---
 *
 * Five views, all driven by the same `chains` array + filter/search state.
 * Tab switching is in `switchTab(tab)`. All views share one `rerender()` helper.
 *
 *   1. TIMELINE  -- horizontal Gantt-style. Spoke length = lifespan along x-axis
 *                   year scale. Has zoom slider (pxPerYear). Grid lines drawn as
 *                   CSS repeating-linear-gradient (NOT divs -- big perf win).
 *                   Bar label appended with current location count if known.
 *
 *   2. LIFESPAN  -- horizontal bar chart sorted by duration (longest first).
 *
 *   3. GRAVEYARD -- same as LIFESPAN but filtered to dead chains only.
 *                   `#gy-axis` shares CSS with `#ls-axis` (combined selector).
 *
 *   4. SNAPSHOT  -- year slider showing all brands alive that year. Cards show:
 *                   age in slider year, location count + delta from prev year,
 *                   HQ city resolved at slider year, ownership era at slider year.
 *                   Default year is 2026. franchiseDataAt() computes interpolated
 *                   counts; reported data points get a `●` marker, interpolated
 *                   ones get `~`.

 *   5. RADIAL    -- canvas-based polar chart with pinch zoom + pan + double-tap

 *                     - ownership        (number of changes)     41 chains
 *                     - franchises       (current location count) 19 chains

  { name:'American Industrial Food', cat:'origin', founded:1900, closed:null, tagline:'The foundation.', desc:'Mass production, canning, and railroad distribution create the infrastructure for standardized food at scale. The foundation every QSR is built on.' },
  { name:'Soup Kitchens (era)',       cat:'origin', founded:1929, closed:1940, tagline:'Feeding strangers.', desc:'Depression-era soup kitchens normalize strangers feeding strangers quickly and cheaply. Standardized portions. No choices. Fastest food in history up to that point.' },
  { name:'Drive-In Culture (era)',    cat:'origin', founded:1920, closed:null, tagline:'Eating in your car.', desc:'Car culture and suburban sprawl create the drive-in concept. Carhops on roller skates. The architecture of eating in your car is invented here, decades before the drive-thru window.' },
  { name:'Pig Stand',                 cat:'origin', founded:1921, closed:2006, tagline:'The first drive-in.', desc:'Dallas Texas. Widely considered the first drive-in restaurant in America. Carhops ran out to cars. The Pig Sandwich. Open 85 years. Gone 2006. The true origin of American drive-in culture.' },

  // ---- BEVERAGES ----
  { name:'Coca-Cola',    cat:'beverage', founded:1886, closed:null, tagline:'The default cola.',
    desc:"McDonald's relationship with Coca-Cola is one of the longest exclusive partnerships in food history. Coke supplies McDs with syrup in stainless steel tanks -- the only chain that gets this treatment. McDs Coke hits different and this is why." },
  { name:'Dr Pepper',   cat:'beverage', founded:1885, closed:null, tagline:'Oldest major soft drink.', desc:'Waco Texas. Oldest major soft drink brand in America. Now Dr Pepper Snapple Group. The third cola that is not quite cola. Regional favorite turned national through fountain distribution.' },
  { name:'Pepsi-Cola',  cat:'beverage', founded:1893, closed:null, tagline:'The challenger cola.',
    desc:'Caleb Bradham, New Bern North Carolina. Pepsi buys Pizza Hut 1977, Taco Bell 1978, KFC 1986. Runs three major fast food chains simultaneously and is terrible at it. Spins them off into Yum Brands 1997.' },
  { name:'RC Cola',     cat:'beverage', founded:1905, closed:null, tagline:'First in cans, first diet.', desc:'Columbus Georgia. RC Cola was the first to sell cola in a can and the first to sell diet cola. Moon Pie and RC Cola is a Southern institution.' },

  { name:"Peet's Coffee",  cat:'beverage', founded:1966, closed:null, tagline:'The grandfather.', desc:'Alfred Peet. Berkeley California. The grandfather of the American specialty coffee movement. Starbucks founders learned from Peet. Bay Area institution before coffee culture was national.' },
  { name:'Dutch Bros Coffee', cat:'beverage', founded:1992, closed:null, tagline:'West Coast drive-thru coffee.', desc:'Grants Pass Oregon. Travis and Dane Boersma start with a pushcart espresso stand. Becomes the drive-thru coffee chain of the West Coast and Mountain West. Goes public 2021.' },
  { name:'Tim Hortons (US)', cat:'donut', founded:1985, closed:null, tagline:'Always fresh.',

    desc:'Hamilton Ontario Canada. Coffee and donuts. Canadian identity wrapped in a cup. Acquired by Burger King to form Restaurant Brands International.' },

  // ---- POS / PAYMENT ----
  { name:'NCR Corporation',         cat:'pos', founded:1884, closed:null, tagline:'Invented the cash register.', desc:'National Cash Register Company. Dayton Ohio. The company that invented the cash register. Powered the transaction layer of virtually every American diner, restaurant, and retail store for over a century. POS terminals, ATMs, self-checkout.' },
  { name:'IBM POS Systems',         cat:'pos', founded:1973, closed:null, tagline:'The first modern restaurant POS.', desc:'IBM enters the point-of-sale market with the IBM 3650/3660 restaurant system -- the first modern POS system. Installed at McDonald\'s and Burger King in the mid-1970s. IBM defines what a restaurant register looks like for a generation.' },
  { name:'Verifone',                cat:'pos', founded:1981, closed:null, tagline:'The swipe terminal.', desc:'William Melton. Honolulu Hawaii. The company that puts the credit card swipe terminal on every counter in America. Before Verifone, card authorization was a phone call or a paper imprinter. Verifone makes the swipe instant.' },
  { name:'PAR Technology',          cat:'pos', founded:1968, closed:null, tagline:'Brink POS. Drive-thru screens.', desc:'Originally PAR Government Systems. Pivots to restaurant POS in the 1980s. Brink POS becomes the cloud-native system of choice for major QSR chains. PAR powers the drive-thru order screen at thousands of locations.' },
  { name:'Micros Systems',          cat:'pos', founded:1977, closed:null, tagline:'Dominant full-service POS.', desc:'College Park Maryland. MICROS becomes the dominant POS platform for full-service restaurants and hotels. Acquired by Oracle 2014 for $5.3 billion. Oracle MICROS still runs in tens of thousands of restaurants worldwide.' },
  { name:'Aloha POS (Radiant)',     cat:'pos', founded:1985, closed:null, tagline:'Standard in casual dining.', desc:'Aloha Technologies builds one of the most widely deployed restaurant POS systems in America. Acquired by Radiant Systems, then by NCR in 2011. NCR Aloha becomes a standard in casual dining.' },
  { name:'Heartland Payment Sys.',  cat:'pos', founded:1997, closed:null, tagline:'Major restaurant processor.', desc:'Princeton New Jersey. Heartland becomes one of the largest payment processors in America, focused heavily on restaurants. Breached in 2008 in one of the largest card data heists in history. Acquired by Global Payments 2016.' },
  { name:'Square (restaurant)',     cat:'pos', founded:2009, closed:null, tagline:'The dongle that democratized POS.', desc:'Jack Dorsey and Jim McKelvey. The dongle that turns an iPhone into a card reader. Democratizes payment processing for small restaurants and food trucks. Square for Restaurants becomes a standalone product 2018.' },
  { name:'Toast POS',               cat:'pos', founded:2012, closed:null, tagline:'Restaurant-native cloud POS.', desc:'Boston. Restaurant-specific cloud POS that goes public 2021. Dominates the independent restaurant market. Brings online ordering, loyalty, and payroll under one platform. One of the fastest-growing restaurant tech companies in history.' },
  { name:'Revel Systems',           cat:'pos', founded:2010, closed:null, tagline:'iPad POS.', desc:'iPad-based POS. San Francisco. Part of the wave that brought tablet POS to restaurants. Acquired by Shift4 2023.' },

  // ---- SUPPLY / DISTRIBUTION ----
  { name:'Performance Food Group', cat:'supply', founded:1885, closed:null, tagline:'Third national distributor.', desc:'Richmond Virginia. Third major national food distributor. Origins in a 19th-century butter and egg business. Now publicly traded supplying restaurants, schools, and healthcare.' },
  { name:'Gordon Food Service',    cat:'supply', founded:1897, closed:null, tagline:'Largest private distributor.', desc:'Grand Rapids Michigan. Family-owned food distributor. Largest privately held food distributor in North America. Never went public. Still family-controlled after 125+ years.' },
  { name:'McLane Company',         cat:'supply', founded:1894, closed:null, tagline:'Berkshire Hathaway distribution.', desc:'Originally a Texas grocery. Became a Walmart subsidiary 1990. Acquired by Berkshire Hathaway 2003. Delivers to 7-Eleven, Yum Brands, and hundreds of chains.' },
  { name:'Ben E. Keith Foods',     cat:'supply', founded:1906, closed:null, tagline:'Southwest regional distributor.', desc:'Fort Worth Texas. Regional food distributor with deep roots in Texas and the Southwest. Also operates a major beer distribution arm. Family-owned.' },
  { name:'Martin-Brower',         cat:'supply', founded:1934, closed:null, tagline:"McDonald's dedicated supplier.", desc:"Chicago. One of McDonald's primary distribution partners for decades. Operates dedicated supply chain infrastructure exclusively for McDonald's in many markets. The company that gets the buns and beef to the store before dawn." },
  { name:'Sysco Corporation',      cat:'supply', founded:1969, closed:null, tagline:'Largest food distributor in N.A.', desc:'Houston Texas. The largest food distribution company in North America. If a restaurant is not growing its own food, Sysco probably delivered it. The invisible supply chain of the American restaurant.' },
  { name:'US Foods',               cat:'supply', founded:1989, closed:null, tagline:'Second largest distributor.', desc:'Merger of several regional distributors. Second largest food distributor in America behind Sysco. The two companies attempted to merge 2015; the FTC blocked it.' },
  { name:'Reinhart Foodservice',   cat:'supply', founded:1972, closed:null, tagline:'Top-10 independent distributor.', desc:'La Crosse Wisconsin. Regional distributor that becomes one of the top ten in North America. Acquired by Performance Food Group 2019.' },

  // ---- HYGIENE / UNIFORM ----
  { name:'Vulcan Equipment',   cat:'hygiene', founded:1865, closed:null, tagline:'The commercial range.', desc:'Louisville Kentucky. Commercial ranges, fryers, and steamers. The gas range and fryer in the back of the house is likely a Vulcan. Standard equipment in institutional and restaurant kitchens for over 150 years.' },
  { name:'Bunn-O-Matic',       cat:'hygiene', founded:1840, closed:null, tagline:'The diner coffee brewer.', desc:'Springfield Illinois. The commercial coffee brewer. The Bunn brewer is the standard drip coffee machine in diners and fast food restaurants across America.' },
  { name:'ServiceMaster',      cat:'hygiene', founded:1929, closed:null, tagline:'Cleaning and pest control.', desc:'Memphis. Cleaning services, pest control, and disaster restoration. Parent of Terminix and other brands. Historically provided cleaning and maintenance services to restaurant chains.' },
  { name:'Diversey',           cat:'hygiene', founded:1923, closed:null, tagline:'Commercial kitchen sanitation.', desc:'Originally part of Lever Brothers. Cleaning and hygiene products for commercial kitchens. Competes directly with Ecolab. Sold to Bain Capital, then public.' },
  { name:'Ecolab',             cat:'hygiene', founded:1923, closed:null, tagline:'Cleans the kitchen you eat in.', desc:'St. Paul Minnesota. Sanitizers, pest control, dishwashing systems, kitchen hygiene. If a commercial kitchen is operating to code, Ecolab is almost certainly involved. Operates in 170 countries.' },
  { name:'Aramark',            cat:'hygiene', founded:1936, closed:null, tagline:'Uniform and facilities services.', desc:'Philadelphia. Uniform services, food service management, and facility services. Operates cafeterias in stadiums, hospitals, universities, and prisons.' },
  { name:'Cintas Corporation', cat:'hygiene', founded:1929, closed:null, tagline:'The uniform on the employee.', desc:'Cincinnati Ohio. The company that supplies the uniform on the employee behind the counter. Also supplies restroom services, floor mats, and first aid stations.' },
  { name:'Steritech (Rentokil)',cat:'hygiene', founded:1987, closed:null, tagline:'The health inspector you hire.', desc:'Charlotte North Carolina. Food safety auditing and pest prevention for restaurant chains. The company that shows up unannounced to grade your kitchen. Acquired by Rentokil.' },

  // ---- ADJACENT / EQUIPMENT ----
  { name:'Hobart Corporation',    cat:'adjacent', founded:1897, closed:null, tagline:'The commercial mixer and slicer.', desc:'Troy Ohio. Commercial kitchen equipment. Hobart makes the mixer, the slicer, the dishwasher, and the scale in virtually every commercial kitchen in America. The KitchenAid mixer is a Hobart invention.' },
  { name:'Manitowoc Foodservice', cat:'adjacent', founded:1902, closed:null, tagline:'The ice machine.', desc:'Manitowoc Wisconsin. Ice machines. The Manitowoc ice machine is in more restaurants than any other brand. Also makes commercial cooking equipment.' },
  { name:'Taylor Company',        cat:'adjacent', founded:1926, closed:null, tagline:'The McFlurry machine.', desc:'Rockton Illinois. Makes the soft serve and milkshake machines in McDonald\'s. For decades McDonald\'s had an exclusive service agreement that only Taylor-certified technicians could repair Taylor machines. This is why the McFlurry machine is always broken.' },
  { name:'Henny Penny',           cat:'adjacent', founded:1957, closed:null, tagline:'The pressure fryer.', desc:'Eaton Ohio. Commercial pressure fryers. The Henny Penny fryer is what KFC and Church\'s Chicken use to pressure-fry. The machine that makes the chicken.' },
  { name:'Rational AG',           cat:'adjacent', founded:1973, closed:null, tagline:'The combi oven.', desc:'Landsberg Germany. The Rational SelfCooking Center is the single most transformative piece of commercial kitchen equipment of the last 40 years. Steam plus convection. In every airport, hospital, hotel, and large QSR kitchen worldwide.' },
  { name:'Middleby Corporation',  cat:'adjacent', founded:1888, closed:null, tagline:'Commercial cooking equipment holding co.', desc:'Elgin Illinois. Holds Blodgett ovens, Pitco fryers, Welbilt brands, and dozens more. The invisible conglomerate behind the equipment in the commercial kitchen.' },
  { name:'Loomis (Armored Car)',  cat:'adjacent', founded:1853, closed:null, tagline:'Cash pickup from restaurants.', desc:'Originally Wells Fargo armored transport. Before digital payments dominated, armored car services collected daily cash drops from every fast food location in America. The company that moved the money out.' },

  // ---- CORPORATE / HOLDING ----
  { name:'Yum! Brands',            cat:'corporate', founded:1997, closed:null, tagline:'The Pepsi spinoff.',
    desc:'KFC, Taco Bell, Pizza Hut, A&W under one roof. Largest restaurant company in the world by number of locations for a period. Spun out of PepsiCo.' },
  { name:'Restaurant Brands Intl', cat:'corporate', founded:2014, closed:null, tagline:'3G Capital\'s fast food empire.',
    desc:'3G Capital merges Burger King and Tim Hortons. Acquires Popeyes 2017, Firehouse Subs 2021. Brazilian private equity ends up owning Canadian coffee, American flame-broiling, Louisiana spice, and Florida subs.' },
  { name:'Inspire Brands',         cat:'corporate', founded:2018, closed:null, tagline:'Nobody knows who owns all this.',
    desc:"Arby's Restaurant Group renames itself Inspire Brands. Acquires Buffalo Wild Wings, Sonic, Jimmy John's, Dunkin', Baskin-Robbins. One of the largest private restaurant companies in America. Most people have never heard of it." },
  { name:'Dine Brands',            cat:'corporate', founded:1958, closed:null, tagline:'IHOP + Applebees.',
    desc:"Originally IHOP Corporation. Acquires Applebee's 2007, renames itself Dine Brands. Two full-service casual dining brands under one holding company." },
  { name:'Focus Brands',           cat:'corporate', founded:2004, closed:null, tagline:'The mall food court empire.',
    desc:"Atlanta. Holds Auntie Anne's, Carvel, Cinnabon, Jamba, McAlister's, Moe's, and Schlotzsky's. If you eat in a mall food court, you are likely eating Focus Brands." },
  { name:'FAT Brands',             cat:'corporate', founded:2017, closed:null, tagline:'Aggressive PE roll-up.',
    desc:'Los Angeles. Holds Fatburger, Johnny Rockets, Round Table Pizza, Twin Peaks, and others. One of the newer fast food holding conglomerates.' },
  { name:'JAB Holding Company',    cat:'corporate', founded:1828, closed:null, tagline:'German coffee empire.',
    desc:'German private holding company. Controls Panera, Pret a Manger, Caribou Coffee, Einstein Brothers, and Krispy Kreme. One of the largest coffee and fast casual empires in the world.' },
  { name:'Roark Capital',          cat:'corporate', founded:2001, closed:null, tagline:'The restaurant PE firm.',
    desc:'Atlanta private equity. Owns Arby\'s, Sonic, Jimmy John\'s, Carvel, Cinnabon, and more through Inspire Brands and Focus Brands. One of the most active acquirers in restaurant history. Also acquired Subway 2024 for ~$9.6B.' },

  { name:"Steak 'n Shake",       cat:'diner',   founded:1934, closed:null, tagline:'In sight it must be right.',

    eras:{
      1950:'Frederick "Pal" Barger Jr., inspired by a 2-J\'s carryout in Austin TX while in the USAF (1952) and by meeting Ray Kroc and Fred Turner at the NRA Chicago show (1955), opens Pal\'s at 327 Revere Street in Kingsport TN. Menu: sauceburgers, Frenchie Fries, milkshakes, Cokes. 1958: acquires an Arctic ice-cream operation at 1315 Lynn Garden Drive, becomes Pal\'s #2. 1962: the Big Pal fiberglass statue goes on the Lynn Garden roof.',
      1980:'Thom Crosby joins in 1981 (prior stops: McDonald\'s corporate, Long John Silver\'s corporate, Wendy\'s franchisee). 1984: Barger meets California artists Karen and Tony Barone; Tony sketches the tiered-box drive-thru on a napkin at Skoby\'s. 1985: first tiered-box opens in Colonial Heights TN as Pal\'s #3. Fiberglass burger/hot dog/fries/drink sculptures fabricated in Elizabethton TN. Cyan tile exterior. No speaker box -- face-to-face order at elevated handout window, double drive-thru lanes common.',
      1990:'1994-2001: regional market share doubles; hourly turnover drops from ~200% to 127%. 1999: Crosby becomes CEO, meets David McClaskey of Eastman Chemical. 2000: founds Pal\'s Business Excellence Institute (BEI) -- the training arm that would later teach the model to outside companies.',
      2000:'2001: wins the Malcolm Baldrige National Quality Award (small-business category) -- the FIRST and ONLY restaurant company ever to win. 17 stores, 19% regional market share, ~465 employees, ~$17M sales. March 7, 2002: ceremony at the White House with President George W. Bush. 2004: systemwide sales top $30M. 2006: second Tennessee Excellence Award. 2009: Razzie Tea launches; record sales year.',
      2010:'2010: Pal\'s #23 in Norton VA opens -- biggest opening day in chain history at that point. 2014: Inc. 25 Most Audacious Companies. 2015: BEI wins TNCPE Excellence Award as smallest org ever to receive it. 2016: Harvard Business School case 916-052 published (Pisano, Gino, Staats).',
      2020:'January 2020: BEI spun off as the independent McClaskey Excellence Institute. October 29, 2020: founder Pal Barger dies at 90. January 2023: Pal\'s #31 opens on John B. Dennis Highway, Kingsport. June 2024: HBS releases video supplement 917-701. Stable at 31 units. AUV $2.67M per Technomic 2024 (top-tier for the category). Sales productivity ~$2,500/sq ft vs ~$650 industry average. Order accuracy ~1 error per 3,600 orders vs ~1 in 15 industry. Total transaction under 30 seconds.'
    },
    desc:"Kingsport Tennessee. The first and only restaurant company ever to win the Malcolm Baldrige National Quality Award (2001, small-business category). Sauceburgers, Frenchie Fries, and a cult-favorite Cheddar Rounds. Famous for: 1 error in 3,600 orders, sub-20-second handout, AUV of $2.67M on 31 stores in the Tri-Cities region of TN and VA. Drive-thru only, no speaker box, no online ordering -- Crosby's stated reason is that online ordering is 'a guaranteed way to make sure you get cold food.' Privately held by Bargerburger Inc., no franchising, ever. Taught at Harvard Business School. Founder Pal Barger nicknamed at age 3 as the mascot of his father's basketball team." },

    desc:'Top Hat Drive-In in Shawnee Oklahoma. Carhops return. Drive-in stalls with intercoms. Happy Hour half-price drinks. Slushes. Tots. Acquired by Inspire Brands 2018.' },

  { name:'Krystal',              cat:'burger', founded:1932, closed:null, tagline:'The southern slider.',

  { name:'Five Guys',            cat:'burger', founded:1986, closed:null, tagline:'Burgers and fries.',
    origin:{ city:'Arlington', state:'VA' },
    hq:[

    desc:'Jerry and Janie Murrell and their five sons. Arlington Virginia. No freezers. Fresh beef. Peanuts in the lobby. Slow to franchise until 2003. Murrell family retains ~75% ownership; Miller Investment Management and BDT Capital Partners hold minority stakes.' },
  { name:'Roy Rogers',           cat:'burger', founded:1968, closed:null, tagline:'Goldburgers and the Fixin\'s Bar.',
    eras:{ 1960:'Founded by the Marriott Corporation, licensing the Roy Rogers cowboy persona.', 1990:'Marriott sells to Hardees 1990. Many stores converted. Franchisees revolt.', 2000:'Plamondon family (longtime franchisees) buys back the brand 2002.', 2020:'Roughly 50 locations, mostly Mid-Atlantic.' },
    desc:"Marriott Corporation creates Roy Rogers restaurants using the cowboy actor's name. Sold to Hardees then rescued by franchisees. Roughly 50 locations remain in the Mid-Atlantic. The Fixin's Bar is a cult favorite." },
  { name:'Shake Shack',          cat:'burger', founded:2004, closed:null, tagline:'Stand for something good.',
    ownership:[
      { owner:'Union Square Hospitality (Meyer)', from:2004, to:2015, color:'#6b8e23' },
      { owner:'Shake Shack Inc. (NYSE: SHAK)',    from:2015, to:2026, color:'#3a6e8f' },
    ],
    eras:{ 2000:"Started as a hot-dog cart in Madison Square Park 2001 by Danny Meyer's Union Square Hospitality Group. Becomes a permanent kiosk 2004.", 2010:'IPO January 29 2015 at $21/share. Spikes to $90 within months. Danny Meyer remains Chairman of the Board.', 2020:'~400 locations globally. Premium fast casual segment leader.' },
    desc:'Danny Meyer. Madison Square Park New York. A hot dog cart becomes a shack becomes a publicly traded company. Fine dining sensibility applied to a burger stand. IPO 2015 at $21/share.' },
  { name:'Fatburger',            cat:'burger', founded:1952, closed:null, tagline:'The original LA burger.', desc:'Lovie Yancey opens a burger stand on Western Avenue in Los Angeles. Celebrity-frequented. Expanded internationally. Owned by FAT Brands. The original Los Angeles burger institution.' },
  { name:"Rally's / Checkers",   cat:'burger', founded:1985, closed:null, tagline:'Double drive-thru, no seating.', desc:"Two brands, one company. Rally's in the Midwest and South, Checkers on the East Coast. Double drive-thru format with no indoor seating." },
  { name:"Culver's",             cat:'burger', founded:1984, closed:null, tagline:'ButterBurgers and cheese curds.', desc:'Sauk City Wisconsin. ButterBurgers and cheese curds. Midwest institution. Family-owned and franchise-operated. Consistently ranked highest in customer satisfaction among burger chains.' },
  { name:'Smashburger',          cat:'burger', founded:2007, closed:null, tagline:'The smash technique.', desc:'Denver Colorado. The smash technique -- pressing a ball of beef onto a hot griddle. Acquired by Five Guys parent then spun off, then acquired by Jollibee Foods. The smash burger technique becomes industry-wide trend.' },
  { name:"Wetson's",             cat:'burger', founded:1959, closed:1975, tagline:'The NYC burger before McDs.',
    eras:{ 1950:'Founded in New York metro area. Distinguished by orange-circle signage and 15-cent burgers.', 1960:'Grows to 70+ locations across the NY metro area, the dominant burger chain in NYC.', 1970:"Squeezed by McDonald's and Burger King's national power. The chain folds 1975." },
    desc:'Errol and Herbert Wetanson. New York metro. 70+ locations. The dominant burger chain in NYC before McDonald\'s arrived. Folded 1975. The Wetansons later co-founded the Quality Meats steakhouse group.' },
  { name:'Henry\'s Hamburgers',  cat:'burger', founded:1954, closed:null, tagline:'At peak it beat McDonald\'s in locations.', desc:'Founded by the Bressler family as a McDonald\'s-style competitor. Grows to 200+ locations by 1965 -- more than McDonald\'s at that time. Down to a single location in Benton Harbor Michigan.' },
  { name:'Red Barn',             cat:'burger', founded:1961, closed:1988, tagline:'When the hungries hit.', desc:'Distinctive barn-shaped buildings. Innovated the self-service salad bar -- the first US fast-food chain to do so. Last Red Barn closes 1988, though a few independent ex-franchisees keep barn-shaped buildings running.' },
  { name:"Gino's Hamburgers",    cat:'burger', founded:1957, closed:1982, tagline:'Founded by Baltimore Colts.', desc:"Founded by Baltimore Colts players Gino Marchetti, Alan Ameche, Joe Campanella, and Lou Fischer. Mid-Atlantic regional chain. Marriott acquires Gino's 1982 and converts every location to Roy Rogers." },
  { name:'Burger Chef',          cat:'burger', founded:1954, closed:1996, tagline:"America's almost-McDonald's.",
    eras:{ 1950:'Founded in Indianapolis. By the late 1960s second only to McDonald\'s in US burger-chain locations.', 1960:"Pioneered the 'Funmeal' (a kids meal with a toy) -- predating the McDonald's Happy Meal by years.", 1980:"Hardee's parent acquires Burger Chef 1981 (from General Foods) and converts the locations.", 1990:'Last Burger Chef-branded restaurant closes 1996.' },
    desc:'General Foods owned Burger Chef -- second largest burger chain behind McDs at its peak. Invented the combo meal and kids meal before the Happy Meal. General Foods could not figure out restaurants. Sold to Hardees. Gone 1996.' },
  { name:'Rax Roast Beef',       cat:'sandwich', founded:1967, closed:null, tagline:'Roast beef, the other Arby\'s.',
    eras:{ 1960:'Founded as JAX Roast Beef. Goes through multiple rebrandings.', 1980:'Peak of 504 locations 1984.', 1990:'Rapid contraction.', 2020:'Roughly 7 locations remain. A cult relic.' },
    desc:'Founded as JAX Roast Beef. Competed directly with Arby\'s. Peak of 504 locations 1984. Roughly 7 locations remain. A cult relic of the roast beef era.' },

  // ---- EXTINCT CHAINS (dead brands, expanded coverage) ----
  { name:"Sandy's",              cat:'burger', founded:1956, closed:1979, tagline:'Scottish-themed McDonald\'s clone.',
    desc:'Kewanee IL. Founded by four ex-McDonald\'s franchisees who wanted their own chain. Scottish theme, kilted mascot. Peaked at 235 locations. Merged with Hardee\'s 1972, fully converted by 1979.' },
  { name:'Royal Castle',         cat:'burger', founded:1938, closed:1985, tagline:'White Castle of the South.',
    desc:'Miami FL. Birch beer and 15-cent sliders. Owned by Glen Caribbean / Performance Systems. Peak ~175 locations across FL, GA, LA. Couldn\'t outlast McDonald\'s. Last unit closed 1985. One independent location still operates in Miami selling Royal Castle-branded burgers.' },
  { name:'White Tower',          cat:'burger', founded:1926, closed:2004, tagline:'The other White Castle.',
    eras:{ 1920:'Founded in Milwaukee by John E. Saxe and son Thomas. Direct visual copy of White Castle (turreted white buildings, nickel sliders).', 1930:'White Castle sues for trademark. White Tower loses, pays damages, slightly redesigns. Both chains coexist for decades.', 1980:'Slow attrition.', 2000:'Last Toledo OH location closes 2004.' },
    desc:'The most famous White Castle copycat. Trademark battle ended in defeat. Outlasted the lawsuit by 70 years. Final location: Toledo OH, 2004.' },
  { name:"Henry's Hamburgers",   cat:'burger', founded:1954, closed:null, tagline:'Outsold McDonald\'s in 1960.',
    desc:'Bressler\'s Ice Cream of Chicago launches Henry\'s as a McDonald\'s competitor. Peak of ~200 locations 1965. Briefly outsold McDonald\'s in 1960 systemwide. Long, slow decline. One survivor: Benton Harbor MI, still serving.' },
  { name:'Carrols',              cat:'burger', founded:1960, closed:1976, tagline:'Burger chain that became Burger King.',
    desc:'Syracuse NY. Started as a McDonald\'s-style burger chain, peaked at 150+ locations. 1976: converts every single Carrols restaurant to Burger King franchises. Carrols Corporation today is the LARGEST Burger King franchisee in the world (~1,000 BKs) -- it never died, it became the thing it sold burgers next to.' },
  { name:"Wuv's",                cat:'burger', founded:1979, closed:1996, tagline:'The low-fat burger fad.',
    desc:'Hamburger chain riding the early-80s low-fat health-food wave. Broiled, never fried. Peaked at ~115 locations. The market for low-fat fast food turned out to be smaller than investors hoped. Gone by mid-90s.' },
  { name:"D'Lites of America",   cat:'burger', founded:1978, closed:1986, tagline:'The calorie-counted burger.',
    desc:'Atlanta GA. Whole-wheat buns, multi-grain, salad bar, calorie counts on every menu item. The first calorie-disclosure QSR -- 30 years before NYC mandated it. Peaked at 100+ stores 1985, gone the next year. The health-conscious diner of 1985 was not a real demographic yet.' },
  { name:"Druther's",            cat:'burger', founded:1981, closed:1990, tagline:'Burger Queen rebranded itself to death.',
    desc:'Burger Queen (founded 1956 in Winter Haven FL, later Louisville KY) renames itself Druther\'s in 1981 to escape the "Queen" association. Peaked at 175 stores. Sold to Dairy Queen 1990, converted. One Druther\'s survives in Campbellsville KY.' },

  { name:'Naugles',              cat:'mexican', founded:1970, closed:1995, tagline:'Prove it, or the food is free.',
    desc:'Riverside CA. Founded by Dick Naugle, ex-Del Taco. Slogan: "Prove it, or the food is free." Peak ~225 locations. Merged with Del Taco 1988, fully converted to Del Taco branding by 1995. Revived as a single-location nostalgia project in Huntington Beach 2015.' },
  { name:"Chi-Chi's",            cat:'mexican', founded:1975, closed:2004, tagline:'Killed by green onions.',
    eras:{ 1970:'Founded in Richfield MN by Marno McDermott and Green Bay Packer Max McGee. Sit-down Mexican casual dining.', 1980:'Peak of 210 locations late 1980s.', 1990:'Decline and bankruptcy 2003.', 2000:'November 2003: hepatitis A outbreak at a Beaver Valley PA location traced to imported green onions. 660 sickened, 4 dead -- the largest hepatitis A outbreak in US history. Brand never recovers. All US locations close September 2004.' },
    desc:'Killed by a single hepatitis A outbreak traced to contaminated green onions, November 2003. Brand survives only as a grocery-store salsa label licensed to Hormel.' },

  { name:'Steak and Ale',        cat:'diner', founded:1966, closed:2008, tagline:"Norman Brinker's first empire.",
    desc:'Dallas TX. Founded by Norman Brinker (later founder of Chili\'s, Brinker International). Established the modern casual-dining steakhouse template -- salad bar, oak-paneled walls, dim lighting. Pillsbury acquired 1976. Metromedia Restaurant Group bankruptcy July 2008 closes every location overnight. The corporate-collapse pattern of casual dining.' },
  { name:"Bennigan's",           cat:'diner', founded:1976, closed:2008, tagline:'Irish-pub casual dining collapse.',
    desc:'Atlanta GA. Norman Brinker again. Faux-Irish-pub casual dining. 300+ locations at peak. Metromedia Restaurant Group bankruptcy July 29 2008 closes every corporate Bennigan\'s overnight. A handful of franchised locations survive under independent ownership.' },
  { name:"Quincy's Family Steakhouse", cat:'diner', founded:1973, closed:2002, tagline:'The southern buffet steakhouse.',
    desc:'Greenville SC. Buffet-style family steakhouse. Peak of 200+ locations across the South. Acquired by Buckley\'s Inc., then Advantica, then sold off 1998. Last locations close 2002.' },
  { name:'Bonanza Steakhouse',   cat:'diner', founded:1963, closed:null, tagline:'The Lorne Greene steakhouse.',
    desc:'Westport CT. Named after the TV western, with actor Lorne Greene as initial part-owner. Family-style steakhouse buffet. Peak ~600 locations. Merged with sister chain Ponderosa 1989 under Metromedia. Effectively gone -- 2-3 US locations remain in 2026.' },

  { name:'Morrison\'s Cafeteria', cat:'diner', founded:1920, closed:1998, tagline:'Southern cafeteria empire.',
    desc:'Mobile AL. The dominant Southern cafeteria chain for 75 years. Peak of 150+ locations. Spun off Ruby Tuesday in 1972 (which outlived the parent). Sold to Piccadilly 1998, all locations closed or converted.' },
  { name:"Luby's",               cat:'diner', founded:1947, closed:2020, tagline:'Texas cafeteria icon.',
    desc:'San Antonio TX. The defining Texas cafeteria chain. 200+ locations at peak. Site of the 1991 Killeen TX mass shooting (23 killed, then the deadliest in US history) -- which spurred Texas concealed-carry legislation. Bankruptcy 2020. Asset sale 2021. A handful of independently-operated former Lubys still serve in Texas.' },
  { name:"Bishop's Buffet",      cat:'diner', founded:1920, closed:2000, tagline:'Midwest cafeteria.',
    desc:'Waterloo IA. Midwestern cafeteria chain, 50+ locations at peak. Acquired by K-Mart parent S.S. Kresge 1968 (yes, K-Mart owned a cafeteria chain). Sold off, gradual decline. Last Bishop\'s closes 2000.' },

  { name:'Kenny Rogers Roasters', cat:'chicken', founded:1991, closed:2011, tagline:'Killed by Seinfeld.',
    eras:{ 1990:'Founded by Kenny Rogers and ex-KFC CEO John Y. Brown Jr. Wood-roasted (not fried) chicken. Riding the health-conscious wave.', 1996:'Featured in Seinfeld episode "The Chicken Roaster" (May 1996) where Kramer becomes obsessed with the neon sign. Cultural moment -- but quickly becomes shorthand for desperate-90s-chain.', 2000:'Bankruptcy 1998. Nathan\'s buys US assets, gradually closes US stores. Brand survives strongly in Asia.', 2010:'Last US Kenny Rogers Roasters closes 2011 in Ontario CA. Still operates ~140 stores in Asia.' },
    desc:'Founded by country singer Kenny Rogers + the man who sold KFC to Heublein. Wood-roasted chicken. Famously featured on Seinfeld, which both immortalized and condemned the brand. Bankrupt 1998. Last US store closed 2011. Asia operations continue.' },
  { name:'Boston Market',        cat:'chicken', founded:1985, closed:null, tagline:'Rotisserie chicken in zombie mode.',
    eras:{ 1980:'Founded as Boston Chicken in Newton MA. Rotisserie chicken with home-style sides. The original fast-casual.', 1990:'1993 IPO is one of the hottest restaurant IPOs ever. Renamed Boston Market 1995. Peak ~1,200 stores.', 2000:'Bankruptcy 1998. McDonald\'s buys it 2000 for $173M. Sells to Sun Capital Partners 2007.', 2020:'2023: 27 states sue for unpaid taxes, IRS files $11M lien. Vendors stop deliveries. Mass closures.', 2024:'~25 locations remain in 2026 -- effectively a zombie brand.' },
    desc:'The original fast-casual concept -- rotisserie chicken + home-style sides + no fries. 1993 IPO was one of the hottest of the decade. Bankruptcy 1998. McDonald\'s owned it 2000-2007. Sun Capital killed it slowly. Down to ~25 locations.' },
  { name:"Minnie Pearl's Chicken", cat:'chicken', founded:1968, closed:1972, tagline:'The franchise scam that built federal franchise law.',
    desc:'Country singer Minnie Pearl licenses her name to John Jay Hooker Jr.\'s Performance Systems Inc. Sold 1,800 franchises in 18 months at peak -- but built only ~250 actual stores. Massive accounting fraud; franchisees lost millions. Bankruptcy 1970. The scandal drove the SEC and ultimately the 1979 FTC Franchise Rule requiring Franchise Disclosure Documents. Federal franchise law exists because of this fiasco.' },
  { name:'Pioneer Chicken',      cat:'chicken', founded:1961, closed:null, tagline:'LA\'s lost chicken chain.',
    desc:'Echo Park LA. "Pioneer Take Out" was Southern California\'s dominant chicken chain for two decades. Peak 270+ stores. Acquired by Imasco/Hardee\'s 1988, mismanaged, sold off. Effectively gone from the US -- 2 locations still operate in LA in 2026. Strong in Philippines.' },

  { name:'Showbiz Pizza Place',  cat:'pizza', founded:1980, closed:1992, tagline:'Rock-afire Explosion animatronic pizza.',
    eras:{ 1980:'Founded in Kansas City by Robert Brock after he tried to buy Chuck E. Cheese franchise rights and was rebuffed. Built around the "Rock-afire Explosion" animatronic band by Aaron Fechter.', 1980:'Pizza Time Theatre (Chuck E. Cheese) goes bankrupt 1984. Showbiz parent Brock Hotel Corp acquires it.', 1990:'1992: all Showbiz locations rebrand to Chuck E. Cheese. Rock-afire Explosion animatronics are scrapped or sold to collectors.' },
    desc:'The animatronic-band-and-pizza concept that ate its main competitor (Chuck E. Cheese, 1984) and then was renamed to it (1992). Rock-afire Explosion animatronics have a cult-collector afterlife.' },
  { name:'Pizza Time Theatre',   cat:'pizza', founded:1977, closed:1984, tagline:'The original Chuck E. Cheese.',
    desc:'San Jose CA. Founded by Atari co-founder Nolan Bushnell. First combined pizza, arcade games, and animatronic entertainment. Peak ~250 locations. Bankruptcy 1984. Acquired by Showbiz Pizza Place 1985, branding consolidated as Chuck E. Cheese 1992. The Pizza Time Theatre brand is gone; the concept (rebranded) lives on.' },

  { name:'Mister Donut',         cat:'donut', founded:1956, closed:1990, tagline:"Dunkin's twin brother.",
    desc:'Boston MA. Founded by Harry Winokur, BROTHER-IN-LAW of Dunkin\' founder William Rosenberg. The two split over business strategy and built nearly identical competing donut chains. Peak ~550 US locations. Allied Lyons buys both Mister Donut and Dunkin\' in 1990, converts all US Mister Donut locations to Dunkin\'. Mister Donut survives massively in Japan (~1,200 stores) under Duskin operating license.' },

  { name:"Skipper's Seafood",    cat:'seafood', founded:1969, closed:2018, tagline:'Pacific Northwest fish & chips.',
    desc:'Bellevue WA. Pacific Northwest fast-casual fish & chips, fried clams, chowder. Peak ~200 locations across WA, OR, ID, MT, AK. Multiple owners, gradual contraction. Last Skipper\'s closes 2018. A single licensed location in Federal Way WA still uses the name.' },

  { name:"Bojangles'",           cat:'chicken', founded:1977, closed:null, tagline:"It's Bo time.",
    eras:{ 1970:'Founded by Jack Fulk and Richard Thomas in Charlotte NC. Cajun-spiced chicken plus made-from-scratch biscuits.', 2020:'Taken private by Durational Capital and Jordan Co. 2018. ~800 locations across the Southeast.' },
    desc:'Charlotte North Carolina. Famous chicken and biscuits. Regional powerhouse in the Southeast. Cajun seasoning. Bo-Berry biscuits.' },
  { name:"El Pollo Loco",        cat:'chicken', founded:1975, closed:null, tagline:'Crazy you can taste.',
